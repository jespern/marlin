<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17191d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Opaque, not black-translucent: a translucent Home Screen app lays the
     page out from under the status bar but iOS sizes its web view short by
     the status bar's height, leaving a band at the bottom the page cannot
     paint. Opaque starts the view below the status bar and fills the rest. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="marlin">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<title>marlin</title>
<style>
  :root {
    /* Mirrors the TUI palette (client/render.zig): headings #89ddff, code
       soft-blue #8aa6bf on #2d3035, shell blue #82aaff, prompt bg #42454b.
       Yellow is reserved for approval/warning surfaces, like the terminal. */
    --bg: #17191d; --panel: #1e2126; --panel2: #24282e; --line: #2c313a;
    --fg: #e8eaee; --dim: #8b93a1; --accent: #89ddff; --green: #73d091;
    --yellow: #e8c765; --red: #f07178; --blue: #82aaff;
    --code: #8aa6bf; --code-bg: #2d3035; --prompt-bg: #42454b;
    --add-bg: #1f3729; --del-bg: #3b2429;
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg); display: flex;
    /* Edges, not 100vh/100dvh; only the open keyboard sets a height. */
    position: fixed; top: 0; bottom: 0; left: 0; width: 100%; overflow: hidden;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #side {
    width: 260px; min-width: 260px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  #backdrop { display: none; }
  #topbar { display: none; }
  #side h1 { font-size: 14px; padding: 14px 16px 10px; color: var(--accent); letter-spacing: 1px; }
  #side h1 button {
    float: right; font: inherit; background: none; border: 1px solid var(--line);
    color: var(--dim); border-radius: 4px; cursor: pointer; padding: 0 8px;
  }
  #side h1 button:hover { color: var(--fg); }
  #sessions { overflow-y: auto; flex: 1; }
  .sess { position: relative; padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent; }
  .sess:hover { background: var(--panel2); }
  .sess.active { background: var(--panel2); border-left-color: var(--accent); }
  .sess .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
  .sess .rename {
    display: none; position: absolute; top: 7px; right: 8px;
    font: inherit; font-size: 12px; background: none; border: 0;
    color: var(--dim); cursor: pointer; padding: 2px 4px;
  }
  .sess:hover .rename { display: block; }
  .sess .rename:hover { color: var(--fg); }
  /* The TUI's tab markers (tui.zig tabActivityText / draw.zig styles). */
  .sess .mark { margin-right: 6px; }
  .sess .mark.idle, .sess .mark.paused { color: var(--dim); }
  .sess .mark.done { color: var(--green); }
  .sess .mark.running, .sess .mark.approval { color: var(--yellow); font-weight: 700; }
  .sess .mark.err { color: var(--red); font-weight: 700; }
  .sess .m { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess.child .t::before { content: "↳ "; color: var(--dim); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #topbar, #approval, #composer, #status { flex-shrink: 0; }
  #connection { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; overflow-wrap: anywhere; }
  #connection a { color: var(--accent); }
  #connection-state { color: var(--dim); }
  #push-toggle { margin-top: 10px; }
  #connection-badge { font-size: 11px; color: var(--yellow); }
  #connection-help, #push-help { color: var(--dim); margin-top: 6px; }
  /* Pairing: a device reaching Marlin under its public name pairs once. */
  #pair {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  #pair[hidden] { display: none; }
  #pair form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  #pair h1 { font-size: 14px; color: var(--accent); letter-spacing: 1px; }
  #pair p { color: var(--dim); }
  #pair kbd { color: var(--fg); font: inherit; }
  #pair-code {
    font: inherit; font-size: 28px; letter-spacing: 10px; text-align: center;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 0; width: 100%;
  }
  #pair-code:focus { outline: none; border-color: var(--accent); }
  #pair-error { color: var(--red); min-height: 1.5em; }
  #transcript { order: 1; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overflow-wrap: anywhere; padding: 18px 22px; }
  #history-more { display: none; margin: 0 auto 14px; }
  .mdlink { color: var(--accent); }
  /* A live shell (`!!`): the daemon's terminal, row for row. A shell sized
     by a wider terminal shrinks to fit until typing here takes it over. */
  #term {
    display: none; order: 1; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 8px 6px; white-space: pre; font: 13px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #main.shell #term { display: block; }
  #main.shell #transcript { display: none; }
  #term .row { min-height: 1.25em; }
  #term .cur { background: var(--fg); color: var(--bg); }
  #keybar {
    display: none; order: 3; gap: 4px; padding: 5px 8px; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #main.shell #keybar { display: flex; }
  #keybar button {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 7px 0; cursor: pointer;
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
  }
  #keybar button.on { border-color: var(--accent); color: var(--accent); }
  #main.shell #status .agent { display: none; }
  #status .state.shell { color: var(--blue); }
  .block.shell .head .cmd { color: var(--blue); }
  .block.shell .head .status { color: var(--dim); }
  .block.shell pre { opacity: .8; white-space: pre-wrap; margin-top: 4px; }
  .block.shell .earlier { color: var(--dim); }
  #history-more.show { display: block; }
  .block { margin: 0 0 10px; }
  .user {
    background: var(--prompt-bg); border-left: 3px solid var(--accent);
    padding: 8px 12px; border-radius: 4px; white-space: pre-wrap;
    color: #fff; font-weight: 600;
  }
  .user.optimistic { opacity: .72; border-left-color: var(--dim); }
  .user.optimistic::after { content: " · sending…"; color: var(--dim); font-size: 12px; font-weight: 400; }
  .user.optimistic.accepted { opacity: 1; }
  /* Sent while the agent works: queued until the turn takes it (layout.zig
     wrapInputCard "Queued"). */
  .user.optimistic.queued::before { content: "Queued"; display: block; color: var(--dim); font-size: 12px; font-weight: 400; }
  .user.optimistic.accepted::after { content: ""; }
  .user.optimistic.unconfirmed { border-left-color: var(--yellow); }
  .user.optimistic.unconfirmed::after { content: " · delivery?"; color: var(--yellow); }
  .user.rejected { border-left-color: var(--red); color: var(--red); opacity: .85; }
  .user.rejected::after { content: " · not sent"; color: var(--red); font-size: 12px; }
  /* The marker is absolutely positioned so it aligns with the first line of
     the markdown body (whose leading <p> is block-level); as inline ::before
     content it stranded the dot alone on its own line above the text. */
  /* Reasoning reads like assistant prose (render.zig: reasoning = assistant),
     marked only by the cyan dot. */
  .reasoning { color: var(--fg); padding: 0 12px 0 24px; position: relative; }
  .reasoning::before { content: "·"; color: var(--accent); font-weight: bold; position: absolute; left: 12px; top: 0; }
  /* Tool rows mirror the TUI: dim machinery (⚙ name), a bold blue target for
     file tools, and shell commands colored by role (render.zig shell_*). */
  .tool summary { color: var(--dim); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool summary .name { color: var(--dim); }
  .tool summary .prev { color: var(--blue); font-weight: 700; }
  .tool summary .prev.sh { color: #c8ccd4; font-weight: 400; }
  .sh-exe { color: #82aaff; font-weight: 700; }
  .sh-flag { color: #89ddff; }
  .sh-op { color: #c792ea; font-weight: 700; }
  .sh-str { color: #c3e88d; }
  .sh-path { color: #8aa6bf; }
  .sh-var, .sh-num { color: #f78c6c; }
  .sh-kw { color: #c792ea; font-weight: 700; }
  .sh-com { color: #697098; font-style: italic; }
  /* A run of tool calls folds into one "Ran N commands" line. */
  .tool-group > summary { color: var(--fg); cursor: pointer; }
  .tool-group > summary .failed { color: var(--red); }
  .tool-group:not(.single) > .block { margin: 4px 0 4px 18px; }
  .tool-group.single > summary { display: none; }
  .tool pre, .md pre {
    background: var(--panel); margin: 4px 0; padding: 8px 12px;
    border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .tool pre { color: var(--dim); max-height: 340px; overflow-y: auto; }
  .tool.err summary { color: var(--red); }
  .note { color: var(--code); font-size: 13px; } /* render.zig: note = soft blue */
  /* markdown */
  .md p, .md ul, .md ol, .md blockquote, .md table, .md h1, .md h2, .md h3, .md h4 { margin: 0 0 8px; }
  .md h1, .md h2 { font-size: 16px; color: var(--accent); }
  .md h3, .md h4 { font-size: 14px; color: var(--accent); }
  .md code { background: var(--code-bg); padding: 0 4px; border-radius: 3px; color: var(--code); }
  .md pre code { background: none; padding: 0; color: var(--fg); }
  .md ul, .md ol { padding-left: 24px; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--dim); font-style: italic; }
  .md a { color: var(--blue); }
  .md table { border-collapse: collapse; }
  .md th, .md td { border: 1px solid var(--line); padding: 3px 10px; text-align: left; }
  .md th { background: var(--panel2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  /* diff coloring */
  .d-add { color: var(--green); background: var(--add-bg); display: inline-block; width: 100%; }
  .d-del { color: var(--red); background: var(--del-bg); display: inline-block; width: 100%; }
  .d-hunk { color: var(--blue); }
  .d-meta { color: var(--dim); }
  #approval {
    order: 2; display: none; background: #3a2f1e; border-top: 1px solid var(--yellow);
    padding: 10px 22px; gap: 12px; align-items: center;
  }
  #approval.show { display: flex; }
  /* The agent's question (render.zig approval_card: yellow, bold). */
  #question {
    order: 2; display: none; background: #3a2f1e; border-top: 1px solid var(--yellow);
    padding: 10px 22px;
  }
  #question.show { display: block; }
  #question .q { color: var(--yellow); font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 6px; }
  #question .opts { display: flex; flex-direction: column; gap: 6px; }
  #question .opts button { text-align: left; white-space: normal; overflow-wrap: anywhere; }
  #question .opts .n { color: var(--dim); margin-right: 6px; }
  #question .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  /* A finished Plan-mode proposal is an offer, not a modal. */
  #plan-offer {
    order: 2; display: none; background: #282d34; border-top: 1px solid var(--line);
    padding: 8px 22px; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--code); font-weight: 700;
  }
  #plan-offer.show { display: flex; }
  #plan-offer .label { flex: 1; white-space: nowrap; }
  #composer.plan .prompt { color: var(--code); }
  /* An asked question in the transcript: question as prose, options recede,
     the pick in the user's color (render.zig question_head/question_option). */
  .question-record .qh { font-weight: 700; }
  .question-record .opt { color: #c8ccd4; padding-left: 16px; }
  .question-record .opt.chosen { color: var(--accent); font-weight: 700; }
  .question-record .ans { color: var(--accent); font-weight: 700; padding-left: 16px; }
  .question-record .ans.none { color: var(--code); font-weight: 400; }
  body.asking .question-record:not(.done) { display: none; }
  #approval .q { flex: 1; color: var(--yellow); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #approval .q .prev { font-weight: 400; }
  button.act {
    font: inherit; padding: 3px 12px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--fg); cursor: pointer;
  }
  button.act:hover { border-color: var(--dim); }
  button.act.yes { border-color: var(--green); color: var(--green); }
  button.act.no { border-color: var(--red); color: var(--red); }
  #composer { order: 4; padding-bottom: var(--bottom-inset, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); background: var(--panel); }
  #attachments { flex-basis: 100%; display: flex; gap: 8px; padding: 8px 12px 0; }
  #attachments:empty { display: none; }
  #attachments .att { position: relative; }
  #attachments img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); display: block; }
  #attachments button {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0;
    border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
    font: 12px/1 inherit; cursor: pointer;
  }
  #composer .prompt { padding: 12px 0 12px 8px; color: var(--accent); align-self: flex-start; }
  #attach-btn {
    font: inherit; font-size: 18px; line-height: 1; background: none; border: 0;
    color: var(--dim); padding: 12px 2px 12px 16px; cursor: pointer; align-self: flex-start;
  }
  #attach-btn:hover { color: var(--fg); }
  #mic-btn {
    align-self: flex-end; background: none; border: 0; color: var(--dim); padding: 11px 6px;
    cursor: pointer; line-height: 0;
  }
  #mic-btn:hover { color: var(--fg); }
  #mic-btn.rec { color: var(--red); animation: rec-pulse 1.2s ease-in-out infinite; }
  #mic-btn.busy { opacity: .45; }
  @keyframes rec-pulse { 50% { opacity: .35; } }
  #send-btn { display: none; }
  @media (pointer: coarse) {
    /* On a phone Return is a newline; sending is this button. */
    #send-btn {
      display: block; align-self: flex-end; margin: 6px 10px 6px 4px; width: 34px; height: 34px;
      border-radius: 50%; border: 0; background: var(--accent); color: var(--bg);
      font: inherit; font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer;
    }
    #send-btn:disabled { background: var(--line); color: var(--dim); }
  }
  #input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg);
    font: inherit; padding: 12px; resize: none; max-height: 40vh; overflow-y: auto; line-height: 1.4;
  }
  #status {
    order: 3; display: flex; gap: 10px; padding: 6px 16px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--dim); font-size: 12px;
    align-items: center;
  }
  #status .state.running { color: var(--green); }
  #status .state.awaiting_approval { color: var(--yellow); }
  #status .state.err { color: var(--red); }
  /* render.zig: context warn at 70% (yellow), hot at 90% (red). */
  #status .ctx.warn { color: var(--yellow); }
  #status .ctx.hot { color: var(--red); }
  #status .credits { color: var(--yellow); }
  /* One line: every piece keeps its words; only the folder gives way. */
  #status > span { white-space: nowrap; flex-shrink: 0; }
  #status .cwd {
    flex-shrink: 1;
    color: var(--green); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    direction: rtl; text-align: left; /* keep the folder's name; trim from the left */
  }
  #jump { display: none; }
  #jump.show { display: inline-flex; }
  #status .notice { color: var(--yellow); }
  #status .model { cursor: pointer; }
  #status .model:hover { color: var(--fg); }
  #status .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  #picker {
    /* left/bottom are set on open, anchored to the clicked model name */
    position: fixed; width: min(420px, calc(100vw - 24px));
    max-height: 50vh; display: none; flex-direction: column; z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  #picker.show { display: flex; }
  #picker input {
    background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  #picker-list { overflow-y: auto; }
  #picker-list div { padding: 5px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #picker-list div:hover, #picker-list div.sel { background: var(--panel2); color: var(--accent); }
  #slashmenu {
    position: fixed; width: min(480px, calc(100vw - 24px)); max-height: 40vh;
    display: none; flex-direction: column; overflow-y: auto; z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px;
  }
  #slashmenu.show { display: flex; }
  #slashmenu div { padding: 5px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #slashmenu div:hover, #slashmenu div.sel { background: var(--panel2); }
  #slashmenu .cmd { color: var(--accent); }
  #slashmenu .desc { color: var(--dim); margin-left: 10px; }
  #interrupt {
    display: none; padding: 1px 6px; min-width: 26px; align-items: center;
    justify-content: center; border-color: transparent; background: transparent;
    color: var(--dim); opacity: .6;
  }
  #interrupt.show { display: inline-flex; }
  #interrupt:hover { color: var(--red); border-color: var(--line); opacity: 1; }
  #interrupt.armed { color: var(--red); border-color: var(--red); opacity: 1; }
  /* Sandboxed is the norm, so the pill only appears when it is off. */
  #sandbox-btn { display: none; color: var(--yellow); border-color: var(--yellow); }
  #sandbox-btn.off { display: inline-flex; }
  /* ---- mobile: sidebar becomes an off-canvas drawer behind a top bar ---- */
  @media (max-width: 700px) {
    #topbar {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top));
    }
    #topbar .title {
      flex: 1; color: var(--accent); letter-spacing: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; /* tap to rename */
    }
    #menu-btn {
      font: inherit; font-size: 18px; line-height: 1; background: none;
      border: 1px solid var(--line); color: var(--fg); border-radius: 6px;
      padding: 8px 12px; cursor: pointer;
    }
    #side {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
      width: min(82vw, 320px); min-width: 0;
      transform: translateX(-105%); transition: transform .2s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 4px 0 24px rgba(0,0,0,.5);
    }
    #side.open { transform: translateX(0); }
    #backdrop {
      position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.5);
    }
    #backdrop:not(.show) { display: none; }
    #backdrop.show { display: block; }
    .sess { padding: 12px 16px; }
    .sess .rename { display: block; font-size: 14px; top: 11px; } /* no hover on touch */
    #side h1 { padding: 16px 16px 12px; }
    #side h1 button { padding: 4px 10px; }
    #transcript { padding: 12px; }
    #input { font-size: 16px; } /* <16px makes iOS zoom the page on focus */
    #composer .prompt, #attach-btn { padding-top: 13px; }
    button.act { padding: 8px 14px; }
    #approval { padding: 10px 12px; flex-wrap: wrap; }
    #question, #plan-offer { padding-left: 12px; padding-right: 12px; }
    #approval .q { flex-basis: 100%; white-space: normal; word-break: break-word; max-height: 4.5em; overflow-y: auto; }
    #status { gap: 6px; }
    #status .right { flex-shrink: 0; }
    #status {
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }
  }
</style>
</head>
<body>
<div id="pair" hidden>
  <form id="pair-form">
    <h1>MARLIN</h1>
    <p>Pair this device: in Marlin, open <kbd>/web</kbd> and press <kbd>p</kbd>, then type the code it shows.</p>
    <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
      placeholder="000000" aria-label="pairing code">
    <button id="pair-go" class="act yes" type="submit">Pair</button>
    <p id="pair-error" role="alert"></p>
  </form>
</div>
<div id="side">
  <h1>MARLIN <button id="new-btn" title="new session">+ new</button></h1>
  <div id="sessions"></div>
  <div id="connection">
    <div id="connection-state" role="status">Connecting…</div>
    <a id="canonical-url"></a>
    <p id="connection-help"></p>
    <button id="push-toggle" class="act" hidden>Enable notifications</button>
    <p id="push-help"></p>
  </div>
</div>
<div id="backdrop"></div>
<div id="main">
  <div id="topbar">
    <button id="menu-btn" title="sessions">☰</button>
    <span class="title">marlin</span>
    <span id="connection-badge" role="status">Connecting…</span>
  </div>
  <div id="transcript"><button id="history-more" class="act">load older</button></div>
  <div id="term" aria-label="shell"></div>
  <div id="approval">
    <span class="q"></span>
    <button class="act yes">approve</button>
    <button class="act no">deny</button>
  </div>
  <div id="question" role="dialog" aria-live="polite">
    <div class="q"></div>
    <div class="opts"></div>
    <div class="hint"></div>
  </div>
  <div id="plan-offer">
    <span class="label">plan ready</span>
    <button class="act yes" id="plan-implement" title="Enter">implement</button>
    <button class="act" id="plan-revise" title="e">revise</button>
    <button class="act" id="plan-dismiss" title="Esc">dismiss</button>
  </div>
  <div id="composer">
    <div id="attachments"></div>
    <button id="attach-btn" title="attach images" aria-label="attach images">+</button>
    <span class="prompt">❯</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" autocomplete="off" spellcheck="true" autocapitalize="sentences"
      autocorrect="on" placeholder="message marlin…"></textarea>
    <button id="mic-btn" aria-label="dictate" title="dictate: tap to record, tap to transcribe on the Mac">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button id="send-btn" aria-label="send" title="send" disabled>↑</button>
  </div>
  <div id="picker" role="listbox">
    <input id="picker-filter" placeholder="filter models…" autocomplete="off">
    <div id="picker-list"></div>
  </div>
  <div id="slashmenu" role="listbox"></div>
  <div id="status">
    <span class="state">idle</span><span class="ctx agent"></span><span class="credits agent"></span><span class="agent">·</span><span class="model agent" title="switch model"></span><span class="cwd-sep">·</span><span class="cwd"></span>
    <span class="notice"></span>
    <span class="right">
      <button id="jump" class="act" title="jump to the newest output">↓ new</button>
      <button id="sandbox-btn" class="act" title="the shell sandbox is off; click to turn it on">⛨ sandbox off</button>
      <button id="interrupt" class="act" title="interrupt running turn" aria-label="interrupt running turn">⏹</button>
    </span>
  </div>
  <div id="keybar" aria-label="shell keys">
    <button data-key="esc">esc</button><button data-key="tab">tab</button><button data-key="ctrl" title="the next key with Ctrl">ctrl</button><button data-key="^C">^C</button><button data-key="^D" title="end the shell at its prompt">^D</button><button data-key="bs" aria-label="backspace">⌫</button><button data-key="up" aria-label="up">↑</button><button data-key="down" aria-label="down">↓</button><button data-key="left" aria-label="left">←</button><button data-key="right" aria-label="right">→</button>
  </div>
</div>
<script>
"use strict";
// u64 session/block ids exceed Number.MAX_SAFE_INTEGER: quote them in the
// raw JSON before parsing and send them back unquoted via raw templates.
const bigints = raw => raw.replace(/"(sid|parent_sid|session_id)":(\d{12,})/g, '"$1":"$2"');
const $ = s => document.querySelector(s);
let sid = null, cur = null, es = null, lastSeq = 0, oldestSeq = 0, historyHasOlder = false,
  historyLoading = false, historyBlocks = [], deltaEl = null, deltaText = '', reasoningEl = null,
  reasoningText = '', approvalId = null, sessionsCache = [], interruptArmTimer = null,
  pendingInputs = [], nextInputRequestId = Date.now();
// Set on each session open; replayed history stays collapsed while blocks
// stamped after this moment count as live (block ts is ms epoch).
let openedAt = 0;

// ---- markdown (escape-first; only escaped text ever reaches innerHTML) ----
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    // A file on the Mac ([BLOBS.md](/Users/…/BLOBS.md:19)): its name, as the
    // TUI shows it; the path is the tooltip, since a phone cannot open it.
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span class="mdlink" title="$2">$1</span>');
}
const isDiff = t => t.startsWith('@@ ') || t.includes('\n@@ ');
function diffHtml(t) {
  return t.split('\n').map(l => {
    const e = esc(l);
    if (/^\+\+\+|^--- |^diff --git|^index /.test(l)) return '<span class="d-meta">' + e + '</span>';
    if (l.startsWith('+')) return '<span class="d-add">' + e + '</span>';
    if (l.startsWith('-')) return '<span class="d-del">' + e + '</span>';
    if (l.startsWith('@@')) return '<span class="d-hunk">' + e + '</span>';
    return e;
  }).join('\n');
}
function renderMd(text) {
  const out = [];
  const lines = text.split('\n');
  let i = 0, code = null, codeLang = '', para = [], list = null, table = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<' + list.tag + '>' + list.items.map(x => '<li>' + inlineMd(x) + '</li>').join('') + '</' + list.tag + '>'); list = null; } };
  const flushTable = () => {
    if (!table) return;
    const row = (cells, tag) => '<tr>' + cells.map(c => '<' + tag + '>' + inlineMd(c.trim()) + '</' + tag + '>').join('') + '</tr>';
    out.push('<table>' + row(table.head, 'th') + table.rows.map(r => row(r, 'td')).join('') + '</table>');
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  const cells = l => l.replace(/^\||\|$/g, '').split('|');
  while (i < lines.length) {
    const l = lines[i];
    if (code !== null) {
      if (/^```/.test(l)) {
        const body = code.join('\n');
        out.push('<pre>' + (codeLang === 'diff' || isDiff(body) ? diffHtml(body) : '<code>' + esc(body) + '</code>') + '</pre>');
        code = null;
      } else code.push(l);
      i++; continue;
    }
    if (/^```/.test(l)) { flushAll(); code = []; codeLang = l.slice(3).trim(); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushAll(); const n = Math.min(h[1].length, 4); out.push('<h' + n + '>' + inlineMd(h[2]) + '</h' + n + '>'); i++; continue; }
    if (/^(---+|\*\*\*+)\s*$/.test(l)) { flushAll(); out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { flushAll(); out.push('<blockquote>' + inlineMd(l.replace(/^>\s?/, '')) + '</blockquote>'); i++; continue; }
    const li = l.match(/^\s*[-*]\s+(.*)/), oli = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (li || oli) {
      flushPara(); flushTable();
      const tag = li ? 'ul' : 'ol';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((li || oli)[1]);
      i++; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      flushPara(); flushList();
      if (!table) {
        if (i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
          table = { head: cells(l), rows: [] };
          i += 2; continue;
        }
      } else { table.rows.push(cells(l)); i++; continue; }
    }
    if (l.trim() === '') { flushAll(); i++; continue; }
    flushList(); flushTable();
    para.push(l);
    i++;
  }
  flushAll();
  return out.join('');
}

async function send(rawJson) {
  const r = await fetch('/send', { method: 'POST', body: rawJson });
  const reply = JSON.parse(bigints(await r.text()));
  if (reply.err && reply.err.code === 'unpaired') showPairing('This device is no longer paired.');
  return reply;
}

function notice(text) {
  const n = $('#status .notice');
  n.textContent = text;
  setTimeout(() => { if (n.textContent === text) n.textContent = ''; }, 5000);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// New output follows only while the reader is at the bottom; scrolled up,
// they keep their place and "↓ new" offers the way back. Sending, opening a
// session, and that button force the jump.
let pinned = true;
function nearBottom(t) { return t.scrollHeight - t.clientHeight - t.scrollTop < 48; }
function scrollBottom(force = false) {
  const t = $('#transcript');
  if (force || pinned) {
    t.scrollTop = t.scrollHeight;
    pinned = true;
    $('#jump').classList.remove('show');
  } else $('#jump').classList.add('show');
}

function clearDelta() {
  if (deltaEl) { deltaEl.remove(); deltaEl = null; }
  deltaText = '';
}

function clearReasoning() {
  if (reasoningEl) { reasoningEl.remove(); reasoningEl = null; }
  reasoningText = '';
}

function addOptimisticInput(targetSid, text, steer) {
  const requestId = ++nextInputRequestId;
  const node = el('div', 'block user optimistic' + (steer ? ' queued' : ''), (steer ? '↪ ' : '') + text);
  node.dataset.requestId = String(requestId);
  $('#transcript').appendChild(node);
  pendingInputs.push({ requestId, sid: targetSid, text, steer, node });
  scrollBottom(true);
  return pendingInputs[pendingInputs.length - 1];
}

function settleOptimisticInput(kind, text) {
  const i = pendingInputs.findIndex(p => p.sid === sid && p.text === text);
  if (i < 0) return false;
  const pending = pendingInputs.splice(i, 1)[0];
  if (!pending.node.isConnected) return false;
  pending.node.className = 'block user';
  pending.node.textContent = (kind === 'steer' ? '↪ ' : '') + text;
  delete pending.node.dataset.requestId;
  // Move the optimistic row to the durable event's actual position. This is
  // observable for steering: the in-flight row can precede the assistant's
  // final block locally, while the durable steer correctly follows it.
  $('#transcript').appendChild(pending.node);
  scrollBottom();
  return true;
}

function rejectOptimisticInput(pending, message, uncertain) {
  if (!pending.node.isConnected) return;
  if (uncertain) {
    pending.node.classList.add('unconfirmed');
    pending.node.title = 'delivery unconfirmed: ' + message;
  } else {
    const i = pendingInputs.indexOf(pending);
    if (i >= 0) pendingInputs.splice(i, 1);
    pending.node.className = 'block user rejected';
    pending.node.title = message;
  }
  notice(message);
}

// Port of render.zig shellCommandSpans: lexical shell styling that picks out
// what people scan for (programs, flags, operators, strings, paths,
// variables) without parsing the shell.
const shellKeywords = new Set('case do done elif else esac fi for function if in select then time until while'.split(' '));
const shellCommandKeywords = new Set('do elif else for function if select then time until while'.split(' '));
const shellWrappers = new Set('command builtin env exec nohup sudo'.split(' '));
const isShellOp = c => '&|;<>()'.includes(c);
const isDigit = c => c >= '0' && c <= '9';
function shellOperatorEnd(cmd, start) {
  let at = start;
  while (at < cmd.length && isDigit(cmd[at])) at++;
  if (at === cmd.length || !isShellOp(cmd[at])) return -1;
  if (at > start && cmd[at] !== '<' && cmd[at] !== '>') return -1;
  at++;
  while (at < cmd.length && (isShellOp(cmd[at]) || isDigit(cmd[at]))) at++;
  return at;
}
function operatorExpectsCommand(op) {
  if (!op || isDigit(op[0]) || op[0] === '<' || op[0] === '>' || op.startsWith('&>')) return false;
  return /[|;&()]/.test(op);
}
// Drop a redundant `zsh -lc "…"` launcher when the payload is wholly quoted
// (render.zig shellDisplayCommand).
function shellDisplayCommand(command) {
  const m = command.trim().match(/^(\S+)((?:\s+-\S*)*?)\s+(--command|-[^-\s]*c[^\s]*)\s+(["'])([\s\S]*)\4$/);
  if (!m || !/^(sh|bash|zsh|dash|ksh|fish)$/.test(m[1].split('/').pop())) return command;
  return m[5];
}
function shellHtml(cmd) {
  let out = '', at = 0, expect = true;
  const span = (cls, a, b) => { out += '<span class="sh-' + cls + '">' + esc(cmd.slice(a, b)) + '</span>'; };
  while (at < cmd.length) {
    const ws = at;
    while (at < cmd.length && (cmd[at] === ' ' || cmd[at] === '\t')) at++;
    out += esc(cmd.slice(ws, at));
    if (at >= cmd.length) break;
    const c = cmd[at];
    if (c === '#') { span('com', at, cmd.length); break; }
    if (c === '"' || c === "'" || c === '`') {
      let end = at + 1;
      while (end < cmd.length) {
        if (cmd[end] === '\\' && c !== "'") { end = Math.min(end + 2, cmd.length); continue; }
        if (cmd[end] === c) { end++; break; }
        end++;
      }
      span('str', at, end); expect = false; at = end; continue;
    }
    if (c === '$') {
      let end = at + 1;
      if (cmd[end] === '{') { while (end < cmd.length && cmd[end] !== '}') end++; if (end < cmd.length) end++; }
      else while (end < cmd.length && /[A-Za-z0-9_]/.test(cmd[end])) end++;
      span('var', at, end); at = end; continue;
    }
    const opEnd = shellOperatorEnd(cmd, at);
    if (opEnd !== -1) {
      span('op', at, opEnd);
      if (operatorExpectsCommand(cmd.slice(at, opEnd))) expect = true;
      at = opEnd; continue;
    }
    let end = at + 1;
    while (end < cmd.length && !' \t"\'`'.includes(cmd[end]) && !isShellOp(cmd[end])) end++;
    const word = cmd.slice(at, end);
    const assignment = word.includes('=') && word[0] !== '-';
    if (expect && assignment) span('var', at, end);
    else if (shellKeywords.has(word)) { span('kw', at, end); expect = shellCommandKeywords.has(word); }
    else if (expect) { span('exe', at, end); expect = shellWrappers.has(word); }
    else if (word.length > 1 && word[0] === '-') span('flag', at, end);
    else if (/^[.~/]/.test(word) || word.includes('/')) span('path', at, end);
    else if (assignment) span('var', at, end);
    else if (/^\d+$/.test(word)) span('num', at, end);
    else out += esc(word);
    at = end;
  }
  return out;
}

// Consecutive tool calls fold into one "Ran N commands" line, as in the TUI;
// the description notes and approvals between them fold in with them. A
// lone call shows as its own row.
function lastToolGroup(t) {
  const last = t.lastElementChild;
  return last && last.classList.contains('tool-group') ? last : null;
}
function updateToolGroup(g) {
  const calls = [...g.children].filter(c => c.classList.contains('tool'));
  const failed = calls.filter(c => c.classList.contains('err')).length;
  const running = calls.filter(c => c.dataset.call && !c.querySelector('pre')).length;
  const single = calls.length <= 1;
  if (single !== g.classList.contains('single')) {
    g.classList.toggle('single', single);
    g.open = single;
  }
  const s = g.firstElementChild;
  s.replaceChildren('⚙ ' + (running ? 'Running ' : 'Ran ') + calls.length + (calls.length === 1 ? ' command' : ' commands'));
  if (failed) s.appendChild(el('span', 'failed', ' · ' + failed + ' failed'));
}
function addToToolGroup(t, node, kind) {
  let g = lastToolGroup(t);
  if (!g) {
    if (kind !== 'tool_call') return false;
    g = el('details', 'block tool-group single');
    g.open = true;
    g.appendChild(el('summary'));
    t.appendChild(g);
  }
  g.appendChild(node);
  updateToolGroup(g);
  return true;
}

// Port of layout.zig toolDisplayName / decodedDisplayArg / shortenDisplayPath:
// each tool shows the one argument worth scanning, never raw JSON.
const lower = n => (n || '').toLowerCase();
const isReadTool = n => lower(n) === 'read' || n === 'read_file';
const isFileTool = n => isReadTool(n) || lower(n) === 'write' || n === 'write_file' || lower(n) === 'edit';
const isFileEditTool = n => ['edit', 'write_file', 'Edit', 'Write', 'MultiEdit', 'NotebookEdit'].includes(n);
function toolDisplayName(name) {
  const n = lower(name);
  if (n === 'sleep') return 'Sleep';
  if (isReadTool(name)) return 'Read';
  if (n === 'write' || name === 'write_file') return 'Write';
  const names = {edit: 'Edit', bash: 'Bash', grep: 'Grep', glob: 'Glob', fetch: 'Fetch', webfetch: 'Fetch', websearch: 'Search', task: 'Task'};
  if (names[n]) return names[n];
  if (name === 'task_batch') return 'Tasks';
  if (name === 'plan_update') return 'Plan';
  return name;
}
// Session-relative paths; an absolute path elsewhere keeps only its basename.
function shortenDisplayPath(path, cwd) {
  const root = cwd === '/' ? cwd : (cwd || '').replace(/\/+$/, '');
  if (root && path.startsWith(root)) {
    if (path.length === root.length) return '.';
    if (root === '/') return path.slice(1);
    if (path[root.length] === '/') return path.slice(root.length + 1);
  }
  return path.split('/').pop();
}
function toolDisplayArg(name, argsJson, cwd) {
  let a;
  try { a = JSON.parse(argsJson || '{}'); } catch { return null; }
  if (!a || typeof a !== 'object') return null;
  const str = v => typeof v === 'string' ? v : null;
  const path = v => v === null ? null : {value: v.startsWith('/') ? shortenDisplayPath(v, cwd) : v, isPath: true};
  const n = lower(name);
  if (isFileTool(name) || isFileEditTool(name))
    return path(str(a.path) ?? str(a.file_path) ?? str(a.filePath) ?? str(a.notebook_path));
  const plain = v => v === null ? null : {value: v, isPath: false};
  if (n === 'bash') return plain(str(a.command));
  if (n === 'grep' || n === 'glob') return plain(str(a.pattern));
  if (n === 'fetch' || n === 'webfetch') return plain(str(a.url));
  if (n === 'websearch') return plain(str(a.query));
  if (n === 'task') return plain(str(a.description) ?? str(a.prompt));
  if (name === 'plan_update') return plain(str(a.explanation));
  for (const [key, isPath] of [['path', true], ['file_path', true], ['command', false], ['pattern', false],
                               ['url', false], ['query', false], ['description', false], ['prompt', false]]) {
    const v = str(a[key]);
    if (v !== null) return isPath ? path(v) : plain(v);
  }
  return null;
}

const rehydrationPrefix = '[rehydrated after compaction]';

function rehydrationNote(text) {
  const first = (text || '').slice(rehydrationPrefix.length).trimStart().split('\n', 1)[0];
  const path = first.replace(/:\s*$/, '').trim();
  return path ? 'rehydrated ' + path : 'rehydrated file context';
}

function isCompactionStatusNote(text) {
  return text.startsWith('context compacted automatically') ||
    text.startsWith('context compacted by /compact');
}

function clippedNote(text) {
  return text.length <= 480 ? text : text.slice(0, 480) + ' …';
}

function addBlock(b, target = $('#transcript'), live = true) {
  const t = target;
  const kind = Object.keys(b.body)[0];
  const v = b.body[kind];
  let node = null;
  if (kind === 'user_msg') {
    const synthetic = v.synthetic || (v.text || '').startsWith(rehydrationPrefix);
    // The user spoke after a proposal: it is no longer the open offer.
    if (!synthetic && target === $('#transcript')) planProposalReady = false;
    if (synthetic)
      node = el('div', 'block note', '[' + rehydrationNote(v.text) + ']');
    else if (live && settleOptimisticInput(kind, v.text || ''))
      return;
    else {
      node = el('div', 'block user', v.text);
      const n = (v.attachments || []).length;
      if (n) node.appendChild(el('span', 'note', (v.text ? ' ' : '') + '[' + n + (n === 1 ? ' image]' : ' images]')));
    }
  }
  else if (kind === 'assistant_msg') {
    if (live) { clearDelta(); clearReasoning(); }
    if (cur && cur.plan_mode && target === $('#transcript')) { planProposalReady = true; updatePlanOffer(); }
    node = el('div', 'block md');
    node.innerHTML = renderMd(v.text);
  } else if (kind === 'reasoning') {
    // As in the TUI: commentary finishes the live text, thinking the live
    // thinking, whatever part of either this page saw stream.
    if (live) { if (v.commentary) clearDelta(); else clearReasoning(); }
    node = el('div', 'block reasoning md');
    node.innerHTML = renderMd(v.text);
  } else if (kind === 'tool_call' && isAskUserTool(v.name)) {
    node = questionRecord(v);
  } else if (kind === 'tool_call') {
    node = el('details', 'block tool');
    const s = el('summary', null, '⚙ ');
    s.appendChild(el('span', 'name', toolDisplayName(v.name)));
    const arg = toolDisplayArg(v.name, v.args_json, cur ? cur.cwd : '');
    if (arg) {
      s.appendChild(document.createTextNode(' '));
      const preview = arg.value.slice(0, 400);
      if (lower(v.name) === 'bash') {
        const prev = el('span', 'prev sh');
        prev.innerHTML = shellHtml(shellDisplayCommand(preview));
        s.appendChild(prev);
      } else s.appendChild(el('span', 'prev', preview));
    }
    node.appendChild(s);
    node.dataset.call = v.call_id;
  } else if (kind === 'tool_result') {
    const pre = el('pre');
    const body = v.inline_body || '';
    if (isDiff(body)) pre.innerHTML = diffHtml(body);
    else pre.textContent = body;
    const call = t.querySelector(`[data-call="${CSS.escape(v.call_id || '')}"]`);
    if (call && call.classList.contains('question-record')) { answerQuestionRecord(call, v); return; }
    if (call) {
      if (v.status && v.status !== 'ok') {
        call.classList.add('err');
        // Auto-expand only LIVE failures; a replayed transcript full of
        // historical errors must not arrive as a wall of open sections.
        if (live && typeof b.ts === 'number' && b.ts >= openedAt) call.open = true;
      }
      call.appendChild(pre);
      const group = call.closest('.tool-group');
      if (group) {
        updateToolGroup(group);
        if (call.open) group.open = true;
      }
      return;
    }
    node = el('details', 'block tool' + (v.status !== 'ok' ? ' err' : ''));
    node.appendChild(el('summary', null, 'result'));
    node.appendChild(pre);
  } else if (kind === 'system_note') {
    if (isCompactionStatusNote(v.text || '')) return;
    node = el('div', 'block note', '[' + clippedNote(v.text || '') + ']');
  }
  else if (kind === 'shell_transcript') node = shellTranscriptNode(v);
  else if (kind === 'compaction') node = el('div', 'block note', '≋ context compacted');
  else if (kind === 'approval') node = el('div', 'block note', 'approval: ' + (v.decision || 'pending'));
  else if (kind === 'steer') {
    if (live && settleOptimisticInput(kind, v.text || '')) return;
    node = el('div', 'block user', '↪ ' + v.text);
  }
  if (node) {
    // An asked question is a conversation turn, not machinery: never folded.
    const foldable = (kind === 'tool_call' && !node.classList.contains('question-record')) ||
      kind === 'tool_result' || kind === 'system_note' || kind === 'approval';
    if (!foldable || !addToToolGroup(t, node, kind)) t.appendChild(node);
    if (live) scrollBottom();
  }
}

function updateHistoryButton() {
  const button = $('#history-more');
  button.classList.toggle('show', historyHasOlder && oldestSeq > 1);
  button.disabled = historyLoading;
  button.textContent = historyLoading ? 'loading…' : 'load older';
}

function disarmInterrupt() {
  if (interruptArmTimer) clearTimeout(interruptArmTimer);
  interruptArmTimer = null;
  const button = $('#interrupt');
  button.classList.remove('armed');
  button.textContent = '⏹';
  button.title = 'interrupt running turn';
  button.setAttribute('aria-label', 'interrupt running turn');
}

const spinFrames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
let spinTimer = null, spinIndex = 0;
// "claudecode/claude-opus-5-5" → "opus-5.5": the last path segment, without
// the vendor prefix, with a trailing "-N-M" version read as "N.M".
function shortModel(model) {
  return (model || '').split('/').pop().replace(/^claude-/, '').replace(/-(\d+)-(\d+)$/, '-$1.$2');
}
function setModelLabel(model) {
  const label = $('#status .model');
  label.textContent = shortModel(model);
  label.title = (model || '') + ' · switch model';
}
// Context fill from session_meta; blank until the daemon has measured it.
function setContext(meta) {
  const ctx = $('#status .ctx');
  const used = meta ? Number(meta.context_used) : 0, limit = meta ? Number(meta.context_limit) : 0;
  if (!limit || !used) { ctx.textContent = ''; ctx.className = 'ctx agent'; return; }
  const pct = Math.min(100, Math.round(used / limit * 100));
  ctx.textContent = ' · ' + pct + '%';
  ctx.title = used.toLocaleString() + ' of ' + limit.toLocaleString() + ' tokens';
  ctx.className = 'ctx agent' + (pct >= 90 ? ' hot' : pct >= 70 ? ' warn' : '');
}
// The TUI's "(using api credits)": a guest billing paid API credits.
function setCredits(on) {
  $('#status .credits').textContent = on ? ' · api credits' : '';
  $('#status .credits').title = on ? 'this Claude session is using paid API credits' : '';
}
// render.zig statusCwd: the session folder, ~/… under the daemon's home.
let homeDir = '';
function displayCwd(cwd) {
  if (!cwd) return '';

  return cwd;
}
function setCwd(cwd) {
  const shown = displayCwd(cwd);
  // LRM marks keep the path's slashes in order inside the right-to-left
  // span that trims from the left.
  $('#status .cwd').textContent = shown ? '\u200e' + shown + '\u200e' : '';
  $('#status .cwd').title = cwd || '';
  $('#status .cwd-sep').hidden = !shown;
}
function setState(state) {
  const st = $('#status .state');
  if (shellView) state = 'shell';
  if (spinTimer) { clearInterval(spinTimer); spinTimer = null; }
  if (state === 'running') {
    // The TUI's braille spinner; static "running" reads as stuck.
    st.textContent = spinFrames[spinIndex] + ' running';
    spinTimer = setInterval(() => {
      spinIndex = (spinIndex + 1) % spinFrames.length;
      st.textContent = spinFrames[spinIndex] + ' running';
    }, 100);
  } else {
    st.textContent = state;
  }
  st.className = 'state ' + state;
  $('#interrupt').classList.toggle('show', state === 'running' || state === 'awaiting_approval');
  if (state !== 'running' && state !== 'awaiting_approval') disarmInterrupt();
  if (state !== 'awaiting_approval') { $('#approval').classList.remove('show'); hideQuestion(); }
  updatePlanOffer();
}

function handle(m) {
  if (m.blk) {
    if (m.blk.sid !== sid) return;
    const b = m.blk.b;
    if (historyLoading && b.seq < oldestSeq) {
      historyBlocks.push(b);
      return;
    }
    if (b.seq <= lastSeq) return;
    lastSeq = b.seq;
    if (!oldestSeq || b.seq < oldestSeq) oldestSeq = b.seq;
    addBlock(b);
  } else if (m.replay_done) {
    if (m.replay_done.sid !== sid) return;
    if (historyLoading) {
      const t = $('#transcript');
      const oldHeight = t.scrollHeight;
      const fragment = document.createDocumentFragment();
      for (const b of historyBlocks) addBlock(b, fragment, false);
      t.insertBefore(fragment, $('#history-more').nextSibling);
      if (m.replay_done.oldest_seq) oldestSeq = m.replay_done.oldest_seq;
      historyHasOlder = !!m.replay_done.has_older;
      historyBlocks = [];
      historyLoading = false;
      updateHistoryButton();
      t.scrollTop += t.scrollHeight - oldHeight;
    } else {
      if (m.replay_done.oldest_seq) oldestSeq = m.replay_done.oldest_seq;
      historyHasOlder = !!m.replay_done.has_older;
      updateHistoryButton();
    }
  } else if (m.delta) {
    if (m.delta.sid !== sid) return;
    if (!deltaEl) { deltaEl = el('div', 'block md'); $('#transcript').appendChild(deltaEl); }
    // Opened mid-stream: the daemon sends all of it so far.
    if (m.delta.replace) deltaText = '';
    deltaText += m.delta.text;
    deltaEl.innerHTML = renderMd(deltaText);
  } else if (m.reasoning_delta) {
    if (m.reasoning_delta.sid !== sid) return;
    if (!reasoningEl) { reasoningEl = el('div', 'block reasoning md'); $('#transcript').appendChild(reasoningEl); }
    if (m.reasoning_delta.replace) reasoningText = '';
    reasoningText += m.reasoning_delta.text;
    reasoningEl.innerHTML = renderMd(reasoningText);
    scrollBottom();
  } else if (m.session_meta) {
    if (m.session_meta.sid === sid) setContext(m.session_meta);
  } else if (m.status) {
    const summary = sessionsCache.find(s => s.sid === m.status.sid);
    const was = summary && summary.state;
    if (summary) summary.state = m.status.state;
    if ((was === 'running' || was === 'awaiting_approval') && (m.status.state === 'idle' || m.status.state === 'done') &&
        String(m.status.sid) !== String(sid)) unreadDone.add(String(m.status.sid));
    if (summary && typeof m.status.usage_credits === 'boolean') summary.usage_credits = m.status.usage_credits;
    renderSessions(sessionsCache);
    if (m.status.sid === sid) setState(m.status.state);
  } else if (m.approval_request) {
    if (m.approval_request.sid !== sid) return;
    approvalId = m.approval_request.approval_id;
    renderApproval(m.approval_request.tool, m.approval_request.args_json);
    $('#approval').classList.add('show');
  } else if (m.question_request) {
    if (m.question_request.sid !== sid) return;
    showQuestion(m.question_request);
  } else if (m.session_list_result) {
    renderSessions(m.session_list_result.sessions);
  } else if (m.session_upsert) {
    const next = sessionsCache.slice();
    const changed = m.session_upsert.session;
    const i = next.findIndex(s => s.sid === changed.sid);
    if (i >= 0) next[i] = changed;
    else if (changed.parent_sid) {
      const parent = next.findIndex(s => s.sid === changed.parent_sid);
      let at = parent >= 0 ? parent + 1 : next.length;
      while (at < next.length && next[at].parent_sid) {
        const sibling = next[at];
        if (changed.created_at < sibling.created_at ||
            (changed.created_at === sibling.created_at && BigInt(changed.sid) < BigInt(sibling.sid))) break;
        at++;
      }
      next.splice(at, 0, changed);
    } else {
      let at = next.length;
      for (let j = 0; j < next.length; j++) {
        if (next[j].parent_sid) continue;
        if (changed.created_at > next[j].created_at ||
            (changed.created_at === next[j].created_at && BigInt(changed.sid) > BigInt(next[j].sid))) {
          at = j; break;
        }
      }
      next.splice(at, 0, changed);
    }
    renderSessions(next);
  } else if (m.session_remove) {
    drafts.delete(String(m.session_remove.sid));
    renderSessions(sessionsCache.filter(s => s.sid !== m.session_remove.sid));
  } else if (m.interrupt_result) {
    const r = m.interrupt_result;
    notice(r.active
      ? (r.already_requested ? 'still cancelling ' : 'cancelling ') + r.phase +
        (r.already_requested ? ' · ' + Math.floor(r.pending_ms / 1000) + 's' :
          ' · phase ' + Math.floor(r.phase_ms / 1000) + 's')
      : 'nothing to interrupt');
  } else if (m.err) {
    notice(m.err.code + ': ' + m.err.msg);
  }
}

async function renameSession(s) {
  const name = window.prompt('rename session', s.title || '');
  if (name === null || !name.trim()) return;
  const r = await send('{"session_rename":{"sid":' + s.sid + ',"title":' + JSON.stringify(name.trim()) + '}}');
  if (r.err) notice(r.err.code + ': ' + r.err.msg);
  else loadSessions();
}

function tabTitle(s) {
  document.title = s && s.title ? s.title + ' · marlin' : 'marlin';
}

// Sessions that finished while you looked elsewhere wear ✓ until opened;
// a durable idle/done state alone must not check every old session.
const unreadDone = new Set();
function sessionMark(s) {
  if (s.pause && s.pause !== 'none') return ['‖', 'paused'];
  if (Number(s.shell_id)) return ['$', 'shell'];
  if (s.state === 'running') return ['●', 'running'];
  if (s.state === 'awaiting_approval') return ['!', 'approval'];

    const d = el('div', 'sess' + (s.parent_sid ? ' child' : '') + (s.sid === sid ? ' active' : ''));
    const title = el('div', 't');
    const mark = sessionMark(s);
    title.appendChild(el('span', 'mark ' + mark[1], mark[0]));
    title.appendChild(document.createTextNode(s.title || '(untitled)'));
    d.appendChild(title);
    d.appendChild(el('div', 'm', s.state + ' · ' + shortModel(s.model)));
    const pen = el('button', 'rename', '✎');
    pen.title = 'rename';
    pen.onclick = ev => { ev.stopPropagation(); renameSession(s); };
    d.appendChild(pen);
    d.onclick = () => open(s);
    box.appendChild(d);
    if (s.sid === sid) {
      cur = s;
      $('#topbar .title').textContent = s.title || '(untitled)';
      tabTitle(s);
      $('#sandbox-btn').classList.toggle('off', !s.sandboxed);
      setCredits(!!s.usage_credits);
      setCwd(s.cwd);
      updatePlanOffer();
    }

}

function drawer(show) {
  $('#side').classList.toggle('open', show);
  $('#backdrop').classList.toggle('show', show);
}

function open(s) {
  drawer(false);
  closeShellView();
  lostShellId = 0;
  disarmInterrupt();
  pinned = true;
  $('#jump').classList.remove('show');
  unreadDone.delete(String(s.sid));
  pendingInputs = [];
  stashDraft();
  $('#topbar .title').textContent = s.title || '(untitled)';
  tabTitle(s);
  sid = s.sid;
  cur = s;
  lastSeq = 0;
  oldestSeq = 0;
  historyHasOlder = false;
  historyLoading = false;
  historyBlocks = [];
  openedAt = Date.now();
  approvalId = null;
  clearDelta();
  clearReasoning();
  $('#transcript').replaceChildren($('#history-more'));
  updateHistoryButton();
  $('#approval').classList.remove('show');
  hideQuestion();
  planProposalReady = false;
  setModelLabel(s.model);
  setContext(null);
  setState(s.state);

async function loadSessions() {
  const r = await send('{"session_list":{"include_archived":false}}');
  if (r.err) throw Error(r.err.msg);
  if (!sid) connectionState('Connected');
  const list = (r.session_list_result || {}).sessions || [];
  renderSessions(list);
  if (!sid) {
    const requested = new URL(location.href).searchParams.get('sid');
    const first = list.find(s => String(s.sid) === requested) || list.find(s => !s.parent_sid) || list[0];
    if (first) open(first);
  }
}

// The composer's slash-command menu: shown while the first token is being
// typed, filtered by prefix. Enter runs the selection (or completes /rename,

// the web UI has no vim modes, so erase is what Escape means here.
const slash_commands = [
  { name: '/model', usage: ' [name]', desc: 'switch model or open the picker' },
  { name: '/sandbox', usage: ' [on|off]', desc: 'toggle the shell sandbox' },
  { name: '/permissions', usage: ' [full|default]', desc: 'full access or default approvals' },
  { name: '/compact', usage: '', desc: 'compact the current context' },
  { name: '/plan', usage: ' [task|off|clear]', desc: 'enter Plan mode or manage its execution todo' },
  { name: '/rename', usage: ' <title>', desc: 'rename this session' },
  { name: '/archive', usage: '', desc: 'archive this session' },

}

function renderSlashMenu() {
  const menu = $('#slashmenu');
  const matches = slashMatches($('#input').value);
  if (!matches.length) { hideSlashMenu(); return; }
  slashSel = Math.min(slashSel, matches.length - 1);
  menu.replaceChildren();
  matches.forEach((c, i) => {
    const row = el('div', i === slashSel ? 'sel' : null);
    row.appendChild(el('span', 'cmd', c.name + c.usage));
    row.appendChild(el('span', 'desc', c.desc));
    row.onclick = () => acceptSlash(c);
    menu.appendChild(row);
  });
  menu.classList.add('show');
  const anchor = $('#input').getBoundingClientRect();
  menu.style.left = Math.max(12, Math.min(anchor.left, innerWidth - menu.offsetWidth - 12)) + 'px';
  menu.style.bottom = (innerHeight - anchor.top + 6) + 'px';
}
function acceptSlash(c) {
  hideSlashMenu();
  if (c.usage.startsWith(' <')) { // required argument: complete, keep typing
    $('#input').value = c.name + ' ';
    $('#input').focus();
    return;
  }
  $('#input').value = '';
  slashCommand(c.name).catch(() => notice('command failed'));
}
$('#input').addEventListener('input', () => { slashSel = 0; renderSlashMenu(); });
$('#input').addEventListener('blur', () => setTimeout(hideSlashMenu, 150));
$('#input').addEventListener('keydown', async e => {
  const menu_open = $('#slashmenu').classList.contains('show');
  const empty = !e.target.value && !pendingAttachments.length;
  if (empty && hasKeyboard() && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (pendingQuestion && e.key >= '1' && e.key <= '9') {
      const option = (pendingQuestion.options || [])[Number(e.key) - 1];
      if (option !== undefined) { e.preventDefault(); answerQuestion(option); return; }
    }
    if ($('#approval').classList.contains('show') && (e.key === 'y' || e.key === 'n')) {
      e.preventDefault(); approve(e.key === 'y'); return;
    }
    if ($('#plan-offer').classList.contains('show')) {
      if (e.key === 'Enter') { e.preventDefault(); acceptPlan(); return; }
      if (e.key === 'e') { e.preventDefault(); revisePlan(); return; }
      if (e.key === 'Escape') { e.preventDefault(); dismissPlan(); return; }
    }
  }
  if (e.key === 'Escape') {
    e.target.value = '';
    hideSlashMenu();
    return;
  }
  if (menu_open) {
    const matches = slashMatches(e.target.value);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      slashSel = (slashSel + (e.key === 'ArrowDown' ? 1 : matches.length - 1)) % matches.length;
      renderSlashMenu();
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      if (matches[slashSel]) $('#input').value = matches[slashSel].name + (matches[slashSel].usage ? ' ' : '');
      renderSlashMenu();
      return;
    }
    if (e.key === 'Enter' && matches[slashSel]) {
      e.preventDefault();
      acceptSlash(matches[slashSel]);
      return;
    }
  }

  // A real keyboard sends on Enter (Shift+Enter is a newline); on a phone
  // Return is a newline and the ↑ button sends.
  if (e.shiftKey || !hasKeyboard()) return;
  e.preventDefault();
  await submitComposer();
});
async function submitComposer() {
  const input = $('#input');
  if (shellView) { shellSubmit(); return; }
  const text = input.value.trim();
  if ((!text && !pendingAttachments.length) || !sid) return;
  input.value = '';
  growInput();
  // `!!` makes this session a shell; `!! <command>` runs just that.
  if (/^!!(\s|$)/.test(text)) { shellConnect({sid, command: text.slice(2).trim()}); return; }
  if (text.startsWith('/')) {
    hideSlashMenu();
    slashCommand(text).catch(() => notice('command failed'));
    return;
  }
  // A parked question owns the composer: typed text IS the answer.
  if (pendingQuestion && text) { answerQuestion(text); return; }
  await submitInput(text);
}
// The composer grows with its text up to 40% of the view, then scrolls.
function growInput() {
  const input = $('#input');
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  $('#send-btn').disabled = !input.value.trim() && !pendingAttachments.length;
}
$('#input').addEventListener('input', growInput);
// pointerdown, not click: keep the field focused so the keyboard stays up.
$('#send-btn').addEventListener('pointerdown', e => { e.preventDefault(); submitComposer(); });
$('#jump').onclick = () => scrollBottom(true);

// ---- per-session drafts: each session keeps its own composer, as each TUI
// tab has its own editor. Slow results (a transcription, an image still
// encoding) land in the session they were started from, open or not.
const drafts = new Map(); // String(sid) -> {text, attachments}
function stashDraft() {
  if (sid == null) return;
  const text = $('#input').value;
  if (text || pendingAttachments.length) drafts.set(String(sid), {text, attachments: pendingAttachments});
  else drafts.delete(String(sid));
}
function restoreDraft(id) {
  const draft = drafts.get(String(id)) || {text: '', attachments: []};
  drafts.delete(String(id));
  $('#input').value = draft.text;
  pendingAttachments = draft.attachments;
  renderAttachments();
}
function stashedDraft(id) {
  if (!drafts.has(String(id))) drafts.set(String(id), {text: '', attachments: []});
  return drafts.get(String(id));
}
function addDraftText(id, text) {
  if (String(id) === String(sid)) { insertAtCursor(text); return; }
  const draft = stashedDraft(id);
  draft.text += (draft.text && !/\s$/.test(draft.text) ? ' ' : '') + text;
}
function addDraftAttachment(id, attachment) {
  if (String(id) === String(sid)) { pendingAttachments.push(attachment); renderAttachments(); return; }
  stashedDraft(id).attachments.push(attachment);
}
const draftAttachmentCount = id => String(id) === String(sid) ? pendingAttachments.length : (drafts.get(String(id)) || {attachments: []}).attachments.length;

// ---- dictation: record here, transcribe on the Mac with /voice's engine ----
// Tap to record, tap again to stop; the text lands at the cursor for review,
// never sent on its own (as in the TUI).
let recorder = null, recordTimer = null;

async function startDictation() {
  const targetSid = sid;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch { notice('microphone access was denied'); return; }
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const type = recorder.mimeType;
    recorder = null;
    finishDictation(targetSid, new Blob(chunks, {type}));
  };
  recorder.start();
  $('#mic-btn').classList.add('rec');
  recordTimer = setTimeout(stopDictation, 5 * 60 * 1000); // safety net
}
function stopDictation() {
  clearTimeout(recordTimer);
  $('#mic-btn').classList.remove('rec');
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
async function finishDictation(targetSid, blob) {
  if (!blob.size) return;
  const button = $('#mic-btn'), input = $('#input'), placeholder = input.placeholder;
  button.classList.add('busy');
  button.disabled = true;
  input.placeholder = 'transcribing…';
  try {
    const r = await fetch('/transcribe', {method: 'POST', headers: {'Content-Type': blob.type || 'application/octet-stream'}, body: blob});
    const reply = await r.json().catch(() => ({}));
    if (!r.ok) throw Error((reply.err && reply.err.msg) || 'transcription failed');
    if (reply.text) addDraftText(targetSid, reply.text);
    else notice('no speech heard');
  } catch (err) { notice(err.message); }
  finally {
    button.classList.remove('busy');
    button.disabled = false;
    input.placeholder = placeholder;
  }
}
function insertAtCursor(text) {
  const input = $('#input'), value = input.value;
  const start = input.selectionStart ?? value.length, end = input.selectionEnd ?? value.length;
  const before = value.slice(0, start), after = value.slice(end);
  const lead = before && !/\s$/.test(before) ? ' ' : '';

  const at = (before + lead + text).length;

$('#mic-btn').onclick = () => recorder ? stopDictation() : startDictation();
$('#mic-btn').hidden = !canRecord();

// ---- live shell (`!!`): the daemon's terminal, drawn here ----
// Paired devices only (the bridge refuses others). The bridge sends frames:
// rows as SGR-styled text, as the daemon records a finished shell, and the
// cursor. At a prompt the composer is a command line (Return runs it); under
// a full-screen program every key goes straight through.
const ansiPalette = ['#2c313a', '#f07178', '#73d091', '#e8c765', '#82aaff', '#c792ea', '#89ddff', '#c8ccd4',

  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
