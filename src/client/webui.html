<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17191d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="marlin">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<title>marlin</title>
<style>
  :root {
    /* Mirrors the TUI palette (client/render.zig): headings #89ddff, code
       soft-blue #8aa6bf on #2d3035, shell blue #82aaff, prompt bg #42454b.
       Yellow is reserved for approval/warning surfaces, like the terminal. */
    --bg: #17191d; --panel: #1e2126; --panel2: #24282e; --line: #2c313a;
    --fg: #e8eaee; --dim: #8b93a1; --accent: #89ddff; --green: #73d091;
    --yellow: #e8c765; --red: #f07178; --blue: #82aaff;
    --code: #8aa6bf; --code-bg: #2d3035; --prompt-bg: #42454b;
    --add-bg: #1f3729; --del-bg: #3b2429;
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg); height: 100vh; height: 100dvh; display: flex;
    position: fixed; top: 0; left: 0; width: 100%; overflow: hidden;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #side {
    width: 260px; min-width: 260px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  #backdrop { display: none; }
  #topbar { display: none; }
  #side h1 { font-size: 14px; padding: 14px 16px 10px; color: var(--accent); letter-spacing: 1px; }
  #side h1 button {
    float: right; font: inherit; background: none; border: 1px solid var(--line);
    color: var(--dim); border-radius: 4px; cursor: pointer; padding: 0 8px;
  }
  #side h1 button:hover { color: var(--fg); }
  #sessions { overflow-y: auto; flex: 1; }
  .sess { position: relative; padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent; }
  .sess:hover { background: var(--panel2); }
  .sess.active { background: var(--panel2); border-left-color: var(--accent); }
  .sess .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
  .sess .rename {
    display: none; position: absolute; top: 7px; right: 8px;
    font: inherit; font-size: 12px; background: none; border: 0;
    color: var(--dim); cursor: pointer; padding: 2px 4px;
  }
  .sess:hover .rename { display: block; }
  .sess .rename:hover { color: var(--fg); }
  .sess .m { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess.child .t::before { content: "↳ "; color: var(--dim); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #topbar, #approval, #composer, #status { flex-shrink: 0; }
  #connection { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; overflow-wrap: anywhere; }
  #connection a { color: var(--accent); }
  #connection-state { color: var(--dim); }
  #push-toggle { margin-top: 10px; }
  #connection-badge { font-size: 11px; color: var(--yellow); }
  #connection-help, #push-help { color: var(--dim); margin-top: 6px; }
  #transcript { order: 1; flex: 1; min-height: 0; overflow-y: auto; padding: 18px 22px; }
  #history-more { display: none; margin: 0 auto 14px; }
  #history-more.show { display: block; }
  .block { margin: 0 0 10px; }
  .user {
    background: var(--prompt-bg); border-left: 3px solid var(--accent);
    padding: 8px 12px; border-radius: 4px; white-space: pre-wrap;
    color: #fff; font-weight: 600;
  }
  .user.optimistic { opacity: .72; border-left-color: var(--dim); }
  .user.optimistic::after { content: " · sending…"; color: var(--dim); font-size: 12px; font-weight: 400; }
  .user.optimistic.accepted { opacity: 1; }
  .user.optimistic.accepted::after { content: ""; }
  .user.optimistic.unconfirmed { border-left-color: var(--yellow); }
  .user.optimistic.unconfirmed::after { content: " · delivery?"; color: var(--yellow); }
  .user.rejected { border-left-color: var(--red); color: var(--red); opacity: .85; }
  .user.rejected::after { content: " · not sent"; color: var(--red); font-size: 12px; }
  /* The marker is absolutely positioned so it aligns with the first line of
     the markdown body (whose leading <p> is block-level); as inline ::before
     content it stranded the dot alone on its own line above the text. */
  .reasoning { color: var(--dim); padding: 0 12px 0 24px; position: relative; }
  .reasoning::before { content: "·"; color: var(--accent); font-weight: bold; position: absolute; left: 12px; top: 0; }
  .tool summary { color: var(--dim); cursor: pointer; }
  .tool summary .name { color: var(--blue); }
  .tool summary .prev { color: var(--dim); }
  .tool pre, .md pre {
    background: var(--panel); margin: 4px 0; padding: 8px 12px;
    border-radius: 4px; overflow-x: auto;
  }
  .tool pre { color: var(--dim); max-height: 340px; overflow-y: auto; }
  .tool.err summary { color: var(--red); }
  .note { color: var(--dim); font-size: 13px; }
  /* markdown */
  .md p, .md ul, .md ol, .md blockquote, .md table, .md h1, .md h2, .md h3, .md h4 { margin: 0 0 8px; }
  .md h1, .md h2 { font-size: 16px; color: var(--accent); }
  .md h3, .md h4 { font-size: 14px; color: var(--accent); }
  .md code { background: var(--code-bg); padding: 0 4px; border-radius: 3px; color: var(--code); }
  .md pre code { background: none; padding: 0; color: var(--fg); }
  .md ul, .md ol { padding-left: 24px; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--dim); font-style: italic; }
  .md a { color: var(--blue); }
  .md table { border-collapse: collapse; }
  .md th, .md td { border: 1px solid var(--line); padding: 3px 10px; text-align: left; }
  .md th { background: var(--panel2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  /* diff coloring */
  .d-add { color: var(--green); background: var(--add-bg); display: inline-block; width: 100%; }
  .d-del { color: var(--red); background: var(--del-bg); display: inline-block; width: 100%; }
  .d-hunk { color: var(--blue); }
  .d-meta { color: var(--dim); }
  #approval {
    order: 2; display: none; background: #3a2f1e; border-top: 1px solid var(--yellow);
    padding: 10px 22px; gap: 12px; align-items: center;
  }
  #approval.show { display: flex; }
  #approval .q { flex: 1; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.act {
    font: inherit; padding: 3px 12px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--fg); cursor: pointer;
  }
  button.act:hover { border-color: var(--dim); }
  button.act.yes { border-color: var(--green); color: var(--green); }
  button.act.no { border-color: var(--red); color: var(--red); }
  #composer { order: 4; padding-bottom: var(--bottom-inset, env(safe-area-inset-bottom)); display: flex; border-top: 1px solid var(--line); background: var(--panel); }
  #composer .prompt { padding: 12px 0 12px 16px; color: var(--accent); }
  #input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg);
    font: inherit; padding: 12px;
  }
  #status {
    order: 3; display: flex; gap: 10px; padding: 6px 16px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--dim); font-size: 12px;
    align-items: center;
  }
  #status .state.running { color: var(--green); }
  #status .state.awaiting_approval { color: var(--yellow); }
  #status .state.err { color: var(--red); }
  #status .notice { color: var(--yellow); }
  #status .model { cursor: pointer; }
  #status .model:hover { color: var(--fg); }
  #status .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  #picker {
    /* left/bottom are set on open, anchored to the clicked model name */
    position: fixed; width: min(420px, calc(100vw - 24px));
    max-height: 50vh; display: none; flex-direction: column; z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  #picker.show { display: flex; }
  #picker input {
    background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  #picker-list { overflow-y: auto; }
  #picker-list div { padding: 5px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #picker-list div:hover, #picker-list div.sel { background: var(--panel2); color: var(--accent); }
  #interrupt {
    display: none; padding: 1px 6px; min-width: 26px; align-items: center;
    justify-content: center; border-color: transparent; background: transparent;
    color: var(--dim); opacity: .6;
  }
  #interrupt.show { display: inline-flex; }
  #interrupt:hover { color: var(--red); border-color: var(--line); opacity: 1; }
  #interrupt.armed { color: var(--red); border-color: var(--red); opacity: 1; }
  #sandbox-btn.on { color: var(--green); border-color: var(--green); }
  /* ---- mobile: sidebar becomes an off-canvas drawer behind a top bar ---- */
  @media (max-width: 700px) {
    #topbar {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top));
    }
    #topbar .title {
      flex: 1; color: var(--accent); letter-spacing: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; /* tap to rename */
    }
    #menu-btn {
      font: inherit; font-size: 18px; line-height: 1; background: none;
      border: 1px solid var(--line); color: var(--fg); border-radius: 6px;
      padding: 8px 12px; cursor: pointer;
    }
    #side {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
      width: min(82vw, 320px); min-width: 0;
      transform: translateX(-105%); transition: transform .2s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 4px 0 24px rgba(0,0,0,.5);
    }
    #side.open { transform: translateX(0); }
    #backdrop {
      position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.5);
    }
    #backdrop:not(.show) { display: none; }
    #backdrop.show { display: block; }
    .sess { padding: 12px 16px; }
    .sess .rename { display: block; font-size: 14px; top: 11px; } /* no hover on touch */
    #side h1 { padding: 16px 16px 12px; }
    #side h1 button { padding: 4px 10px; }
    #transcript { padding: 12px; }
    #input { font-size: 16px; } /* <16px makes iOS zoom the page on focus */
    #composer .prompt { padding-top: 13px; }
    button.act { padding: 8px 14px; }
    #approval { padding: 10px 12px; flex-wrap: wrap; }
    #approval .q { flex-basis: 100%; white-space: normal; word-break: break-word; max-height: 4.5em; overflow-y: auto; }
    #status .model { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status .right { flex-shrink: 0; }
    #status {
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }
  }
</style>
</head>
<body>
<div id="side">
  <h1>MARLIN <button id="new-btn" title="new session">+ new</button></h1>
  <div id="sessions"></div>
  <div id="connection">
    <div id="connection-state" role="status">Connecting…</div>
    <a id="canonical-url"></a>
    <p id="connection-help"></p>
    <button id="push-toggle" class="act" hidden>Enable notifications</button>
    <p id="push-help"></p>
  </div>
</div>
<div id="backdrop"></div>
<div id="main">
  <div id="topbar">
    <button id="menu-btn" title="sessions">☰</button>
    <span class="title">marlin</span>
    <span id="connection-badge" role="status">Connecting…</span>
  </div>
  <div id="transcript"><button id="history-more" class="act">load older</button></div>
  <div id="approval">
    <span class="q"></span>
    <button class="act yes">approve</button>
    <button class="act no">deny</button>
  </div>
  <div id="composer">
    <span class="prompt">❯</span>
    <input id="input" autocomplete="off" spellcheck="false" autocapitalize="off"
      autocorrect="off" enterkeyhint="send" placeholder="message marlin…">
  </div>
  <div id="picker" role="listbox">
    <input id="picker-filter" placeholder="filter models…" autocomplete="off">
    <div id="picker-list"></div>
  </div>
  <div id="status">
    <span class="state">idle</span><span>·</span><span class="model" title="switch model"></span>
    <span class="notice"></span>
    <span class="right">
      <button id="sandbox-btn" class="act">⛨ sandbox</button>
      <button id="interrupt" class="act" title="interrupt running turn" aria-label="interrupt running turn">⏹</button>
    </span>
  </div>
</div>
<script>
"use strict";
// u64 session/block ids exceed Number.MAX_SAFE_INTEGER: quote them in the
// raw JSON before parsing and send them back unquoted via raw templates.
const bigints = raw => raw.replace(/"(sid|parent_sid|session_id)":(\d{12,})/g, '"$1":"$2"');
const $ = s => document.querySelector(s);
let sid = null, cur = null, es = null, lastSeq = 0, oldestSeq = 0, historyHasOlder = false,
  historyLoading = false, historyBlocks = [], deltaEl = null, deltaText = '', reasoningEl = null,
  reasoningText = '', approvalId = null, sessionsCache = [], interruptArmTimer = null,
  pendingInputs = [], nextInputRequestId = Date.now();
// Set on each session open; replayed history stays collapsed while blocks
// stamped after this moment count as live (block ts is ms epoch).
let openedAt = 0;

// ---- markdown (escape-first; only escaped text ever reaches innerHTML) ----
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
const isDiff = t => t.startsWith('@@ ') || t.includes('\n@@ ');
function diffHtml(t) {
  return t.split('\n').map(l => {
    const e = esc(l);
    if (/^\+\+\+|^--- |^diff --git|^index /.test(l)) return '<span class="d-meta">' + e + '</span>';
    if (l.startsWith('+')) return '<span class="d-add">' + e + '</span>';
    if (l.startsWith('-')) return '<span class="d-del">' + e + '</span>';
    if (l.startsWith('@@')) return '<span class="d-hunk">' + e + '</span>';
    return e;
  }).join('\n');
}
function renderMd(text) {
  const out = [];
  const lines = text.split('\n');
  let i = 0, code = null, codeLang = '', para = [], list = null, table = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<' + list.tag + '>' + list.items.map(x => '<li>' + inlineMd(x) + '</li>').join('') + '</' + list.tag + '>'); list = null; } };
  const flushTable = () => {
    if (!table) return;
    const row = (cells, tag) => '<tr>' + cells.map(c => '<' + tag + '>' + inlineMd(c.trim()) + '</' + tag + '>').join('') + '</tr>';
    out.push('<table>' + row(table.head, 'th') + table.rows.map(r => row(r, 'td')).join('') + '</table>');
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  const cells = l => l.replace(/^\||\|$/g, '').split('|');
  while (i < lines.length) {
    const l = lines[i];
    if (code !== null) {
      if (/^```/.test(l)) {
        const body = code.join('\n');
        out.push('<pre>' + (codeLang === 'diff' || isDiff(body) ? diffHtml(body) : '<code>' + esc(body) + '</code>') + '</pre>');
        code = null;
      } else code.push(l);
      i++; continue;
    }
    if (/^```/.test(l)) { flushAll(); code = []; codeLang = l.slice(3).trim(); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushAll(); const n = Math.min(h[1].length, 4); out.push('<h' + n + '>' + inlineMd(h[2]) + '</h' + n + '>'); i++; continue; }
    if (/^(---+|\*\*\*+)\s*$/.test(l)) { flushAll(); out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { flushAll(); out.push('<blockquote>' + inlineMd(l.replace(/^>\s?/, '')) + '</blockquote>'); i++; continue; }
    const li = l.match(/^\s*[-*]\s+(.*)/), oli = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (li || oli) {
      flushPara(); flushTable();
      const tag = li ? 'ul' : 'ol';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((li || oli)[1]);
      i++; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      flushPara(); flushList();
      if (!table) {
        if (i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
          table = { head: cells(l), rows: [] };
          i += 2; continue;
        }
      } else { table.rows.push(cells(l)); i++; continue; }
    }
    if (l.trim() === '') { flushAll(); i++; continue; }
    flushList(); flushTable();
    para.push(l);
    i++;
  }
  flushAll();
  return out.join('');
}

async function send(rawJson) {
  const r = await fetch('/send', { method: 'POST', body: rawJson });
  return JSON.parse(bigints(await r.text()));
}

function notice(text) {
  const n = $('#status .notice');
  n.textContent = text;
  setTimeout(() => { if (n.textContent === text) n.textContent = ''; }, 5000);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function scrollBottom() {
  const t = $('#transcript');
  t.scrollTop = t.scrollHeight;
}

function clearDelta() {
  if (deltaEl) { deltaEl.remove(); deltaEl = null; }
  deltaText = '';
}

function clearReasoning() {
  if (reasoningEl) { reasoningEl.remove(); reasoningEl = null; }
  reasoningText = '';
}

function addOptimisticInput(targetSid, text, steer) {
  const requestId = ++nextInputRequestId;
  const node = el('div', 'block user optimistic', (steer ? '↪ ' : '') + text);
  node.dataset.requestId = String(requestId);
  $('#transcript').appendChild(node);
  pendingInputs.push({ requestId, sid: targetSid, text, steer, node });
  scrollBottom();
  return pendingInputs[pendingInputs.length - 1];
}

function settleOptimisticInput(kind, text) {
  const i = pendingInputs.findIndex(p => p.sid === sid && p.text === text);
  if (i < 0) return false;
  const pending = pendingInputs.splice(i, 1)[0];
  if (!pending.node.isConnected) return false;
  pending.node.className = 'block user';
  pending.node.textContent = (kind === 'steer' ? '↪ ' : '') + text;
  delete pending.node.dataset.requestId;
  // Move the optimistic row to the durable event's actual position. This is
  // observable for steering: the in-flight row can precede the assistant's
  // final block locally, while the durable steer correctly follows it.
  $('#transcript').appendChild(pending.node);
  scrollBottom();
  return true;
}

function rejectOptimisticInput(pending, message, uncertain) {
  if (!pending.node.isConnected) return;
  if (uncertain) {
    pending.node.classList.add('unconfirmed');
    pending.node.title = 'delivery unconfirmed: ' + message;
  } else {
    const i = pendingInputs.indexOf(pending);
    if (i >= 0) pendingInputs.splice(i, 1);
    pending.node.className = 'block user rejected';
    pending.node.title = message;
  }
  notice(message);
}

function toolPreview(name, argsJson) {
  try {
    const a = JSON.parse(argsJson);
    if (a.command) return a.command;
    if (a.path) return a.path;
    if (a.pattern) return a.pattern;
    if (a.url) return a.url;
    if (a.prompt) return a.prompt;
    if (a.name) return a.name;
  } catch (e) {}
  return (argsJson || '');
}

const rehydrationPrefix = '[rehydrated after compaction]';

function rehydrationNote(text) {
  const first = (text || '').slice(rehydrationPrefix.length).trimStart().split('\n', 1)[0];
  const path = first.replace(/:\s*$/, '').trim();
  return path ? 'rehydrated ' + path : 'rehydrated file context';
}

function isCompactionStatusNote(text) {
  return text.startsWith('context compacted automatically') ||
    text.startsWith('context compacted by /compact');
}

function clippedNote(text) {
  return text.length <= 480 ? text : text.slice(0, 480) + ' …';
}

function addBlock(b, target = $('#transcript'), live = true) {
  const t = target;
  const kind = Object.keys(b.body)[0];
  const v = b.body[kind];
  let node = null;
  if (kind === 'user_msg') {
    if (v.synthetic || (v.text || '').startsWith(rehydrationPrefix))
      node = el('div', 'block note', '[' + rehydrationNote(v.text) + ']');
    else if (live && settleOptimisticInput(kind, v.text || ''))
      return;
    else
      node = el('div', 'block user', v.text);
  }
  else if (kind === 'assistant_msg') {
    if (live) { clearDelta(); clearReasoning(); }
    node = el('div', 'block md');
    node.innerHTML = renderMd(v.text);
  } else if (kind === 'reasoning') {
    if (live && reasoningText === v.text) clearReasoning();
    else if (live && deltaText === v.text) clearDelta();
    node = el('div', 'block reasoning md');
    node.innerHTML = renderMd(v.text);
  } else if (kind === 'tool_call') {
    node = el('details', 'block tool');
    const s = el('summary', null, '⚙ ');
    s.appendChild(el('span', 'name', v.name));
    s.appendChild(el('span', 'prev', ' ' + toolPreview(v.name, v.args_json).slice(0, 140)));
    node.appendChild(s);
    node.dataset.call = v.call_id;
  } else if (kind === 'tool_result') {
    const pre = el('pre');
    const body = v.inline_body || '';
    if (isDiff(body)) pre.innerHTML = diffHtml(body);
    else pre.textContent = body;
    const call = t.querySelector(`[data-call="${CSS.escape(v.call_id || '')}"]`);
    if (call) {
      if (v.status && v.status !== 'ok') {
        call.classList.add('err');
        // Auto-expand only LIVE failures; a replayed transcript full of
        // historical errors must not arrive as a wall of open sections.
        if (live && typeof b.ts === 'number' && b.ts >= openedAt) call.open = true;
      }
      call.appendChild(pre);
      return;
    }
    node = el('details', 'block tool' + (v.status !== 'ok' ? ' err' : ''));
    node.appendChild(el('summary', null, 'result'));
    node.appendChild(pre);
  } else if (kind === 'system_note') {
    if (isCompactionStatusNote(v.text || '')) return;
    node = el('div', 'block note', '[' + clippedNote(v.text || '') + ']');
  }
  else if (kind === 'compaction') node = el('div', 'block note', '≋ context compacted');
  else if (kind === 'approval') node = el('div', 'block note', 'approval: ' + (v.decision || 'pending'));
  else if (kind === 'steer') {
    if (live && settleOptimisticInput(kind, v.text || '')) return;
    node = el('div', 'block user', '↪ ' + v.text);
  }
  if (node) {
    t.appendChild(node);
    if (live) scrollBottom();
  }
}

function updateHistoryButton() {
  const button = $('#history-more');
  button.classList.toggle('show', historyHasOlder && oldestSeq > 1);
  button.disabled = historyLoading;
  button.textContent = historyLoading ? 'loading…' : 'load older';
}

function disarmInterrupt() {
  if (interruptArmTimer) clearTimeout(interruptArmTimer);
  interruptArmTimer = null;
  const button = $('#interrupt');
  button.classList.remove('armed');
  button.textContent = '⏹';
  button.title = 'interrupt running turn';
  button.setAttribute('aria-label', 'interrupt running turn');
}

const spinFrames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
let spinTimer = null, spinIndex = 0;
function setState(state) {
  const st = $('#status .state');
  if (spinTimer) { clearInterval(spinTimer); spinTimer = null; }
  if (state === 'running') {
    // The TUI's braille spinner; static "running" reads as stuck.
    st.textContent = spinFrames[spinIndex] + ' running';
    spinTimer = setInterval(() => {
      spinIndex = (spinIndex + 1) % spinFrames.length;
      st.textContent = spinFrames[spinIndex] + ' running';
    }, 100);
  } else {
    st.textContent = state;
  }
  st.className = 'state ' + state;
  $('#interrupt').classList.toggle('show', state === 'running' || state === 'awaiting_approval');
  if (state !== 'running' && state !== 'awaiting_approval') disarmInterrupt();
  if (state !== 'awaiting_approval') $('#approval').classList.remove('show');
}

function handle(m) {
  if (m.blk) {
    if (m.blk.sid !== sid) return;
    const b = m.blk.b;
    if (historyLoading && b.seq < oldestSeq) {
      historyBlocks.push(b);
      return;
    }
    if (b.seq <= lastSeq) return;
    lastSeq = b.seq;
    if (!oldestSeq || b.seq < oldestSeq) oldestSeq = b.seq;
    addBlock(b);
  } else if (m.replay_done) {
    if (m.replay_done.sid !== sid) return;
    if (historyLoading) {
      const t = $('#transcript');
      const oldHeight = t.scrollHeight;
      const fragment = document.createDocumentFragment();
      for (const b of historyBlocks) addBlock(b, fragment, false);
      t.insertBefore(fragment, $('#history-more').nextSibling);
      if (m.replay_done.oldest_seq) oldestSeq = m.replay_done.oldest_seq;
      historyHasOlder = !!m.replay_done.has_older;
      historyBlocks = [];
      historyLoading = false;
      updateHistoryButton();
      t.scrollTop += t.scrollHeight - oldHeight;
    } else {
      if (m.replay_done.oldest_seq) oldestSeq = m.replay_done.oldest_seq;
      historyHasOlder = !!m.replay_done.has_older;
      updateHistoryButton();
    }
  } else if (m.delta) {
    if (m.delta.sid !== sid) return;
    if (!deltaEl) { deltaEl = el('div', 'block md'); $('#transcript').appendChild(deltaEl); }
    deltaText += m.delta.text;
    deltaEl.innerHTML = renderMd(deltaText);
  } else if (m.reasoning_delta) {
    if (m.reasoning_delta.sid !== sid) return;
    if (!reasoningEl) { reasoningEl = el('div', 'block reasoning md'); $('#transcript').appendChild(reasoningEl); }
    reasoningText += m.reasoning_delta.text;
    reasoningEl.innerHTML = renderMd(reasoningText);
    scrollBottom();
  } else if (m.status) {
    const summary = sessionsCache.find(s => s.sid === m.status.sid);
    if (summary) summary.state = m.status.state;
    renderSessions(sessionsCache);
    if (m.status.sid === sid) setState(m.status.state);
  } else if (m.approval_request) {
    if (m.approval_request.sid !== sid) return;
    approvalId = m.approval_request.approval_id;
    $('#approval .q').textContent =
      'approve ' + m.approval_request.tool + ' ' + m.approval_request.args_json.slice(0, 160) + ' ?';
    $('#approval').classList.add('show');
  } else if (m.session_list_result) {
    renderSessions(m.session_list_result.sessions);
  } else if (m.session_upsert) {
    const next = sessionsCache.slice();
    const changed = m.session_upsert.session;
    const i = next.findIndex(s => s.sid === changed.sid);
    if (i >= 0) next[i] = changed;
    else if (changed.parent_sid) {
      const parent = next.findIndex(s => s.sid === changed.parent_sid);
      let at = parent >= 0 ? parent + 1 : next.length;
      while (at < next.length && next[at].parent_sid) {
        const sibling = next[at];
        if (changed.created_at < sibling.created_at ||
            (changed.created_at === sibling.created_at && BigInt(changed.sid) < BigInt(sibling.sid))) break;
        at++;
      }
      next.splice(at, 0, changed);
    } else {
      let at = next.length;
      for (let j = 0; j < next.length; j++) {
        if (next[j].parent_sid) continue;
        if (changed.created_at > next[j].created_at ||
            (changed.created_at === next[j].created_at && BigInt(changed.sid) > BigInt(next[j].sid))) {
          at = j; break;
        }
      }
      next.splice(at, 0, changed);
    }
    renderSessions(next);
  } else if (m.session_remove) {
    renderSessions(sessionsCache.filter(s => s.sid !== m.session_remove.sid));
  } else if (m.interrupt_result) {
    const r = m.interrupt_result;
    notice(r.active
      ? (r.already_requested ? 'still cancelling ' : 'cancelling ') + r.phase +
        (r.already_requested ? ' · ' + Math.floor(r.pending_ms / 1000) + 's' :
          ' · phase ' + Math.floor(r.phase_ms / 1000) + 's')
      : 'nothing to interrupt');
  } else if (m.err) {
    notice(m.err.code + ': ' + m.err.msg);
  }
}

async function renameSession(s) {
  const name = window.prompt('rename session', s.title || '');
  if (name === null || !name.trim()) return;
  const r = await send('{"session_rename":{"sid":' + s.sid + ',"title":' + JSON.stringify(name.trim()) + '}}');
  if (r.err) notice(r.err.code + ': ' + r.err.msg);
  else loadSessions();
}

function tabTitle(s) {
  document.title = s && s.title ? s.title + ' · marlin' : 'marlin';
}

function renderSessions(list) {
  sessionsCache = list;
  const box = $('#sessions');
  box.innerHTML = '';
  for (const s of list) {
    const d = el('div', 'sess' + (s.parent_sid ? ' child' : '') + (s.sid === sid ? ' active' : ''));
    d.appendChild(el('div', 't', s.title || '(untitled)'));
    d.appendChild(el('div', 'm', s.state + ' · ' + (s.model || '').split('/').slice(-1)[0]));
    const pen = el('button', 'rename', '✎');
    pen.title = 'rename';
    pen.onclick = ev => { ev.stopPropagation(); renameSession(s); };
    d.appendChild(pen);
    d.onclick = () => open(s);
    box.appendChild(d);
    if (s.sid === sid) {
      cur = s;
      $('#topbar .title').textContent = s.title || '(untitled)';
      tabTitle(s);
      $('#sandbox-btn').classList.toggle('on', !!s.sandboxed);
      $('#sandbox-btn').textContent = s.sandboxed ? '⛨ sandboxed' : '⛨ sandbox off';
      $('#sandbox-btn').title = s.sandboxed ? 'click to disable the shell sandbox' : 'click to enable the shell sandbox';
    }
  }
}

function drawer(show) {
  $('#side').classList.toggle('open', show);
  $('#backdrop').classList.toggle('show', show);
}

function open(s) {
  drawer(false);
  disarmInterrupt();
  pendingInputs = [];
  $('#topbar .title').textContent = s.title || '(untitled)';
  tabTitle(s);
  sid = s.sid;
  cur = s;
  lastSeq = 0;
  oldestSeq = 0;
  historyHasOlder = false;
  historyLoading = false;
  historyBlocks = [];
  openedAt = Date.now();
  approvalId = null;
  clearDelta();
  clearReasoning();
  $('#transcript').replaceChildren($('#history-more'));
  updateHistoryButton();
  $('#approval').classList.remove('show');
  $('#status .model').textContent = s.model || '';
  setState(s.state);
  connectEvents();
  loadSessions();
}

async function loadSessions() {
  const r = await send('{"session_list":{"include_archived":false}}');
  if (r.err) throw Error(r.err.msg);
  if (!sid) connectionState('Connected');
  const list = (r.session_list_result || {}).sessions || [];
  renderSessions(list);
  if (!sid) {
    const requested = new URL(location.href).searchParams.get('sid');
    const first = list.find(s => String(s.sid) === requested) || list.find(s => !s.parent_sid) || list[0];
    if (first) open(first);
  }
}

$('#input').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const text = e.target.value.trim();
  if (!text || !sid) return;
  if (text.startsWith('/')) {
    e.target.value = '';
    slashCommand(text).catch(() => notice('command failed'));
    return;
  }
  const targetSid = sid;
  const state = $('#status .state').textContent;
  const pending = addOptimisticInput(targetSid, text, state === 'running' || state === 'awaiting_approval');
  e.target.value = '';
  try {
    const r = await send('{"input":{"sid":' + targetSid + ',"text":' + JSON.stringify(text) +
      ',"request_id":' + pending.requestId + '}}');
    if (r.err) rejectOptimisticInput(pending, r.err.msg || 'message was not accepted', false);
    else if (pending.node.isConnected && pendingInputs.includes(pending)) pending.node.classList.add('accepted');
  } catch (err) {
    // A lost HTTP reply is ambiguous: the daemon may already have accepted
    // the message. Keep it reconcilable with the SSE block instead of lying.
    rejectOptimisticInput(pending, 'delivery unconfirmed; waiting for session replay', true);
  }
});
$('#approval .yes').onclick = () =>
  send('{"approve":{"sid":' + sid + ',"approval_id":' + JSON.stringify(approvalId) + ',"decision":"granted"}}');
$('#approval .no').onclick = () =>
  send('{"approve":{"sid":' + sid + ',"approval_id":' + JSON.stringify(approvalId) + ',"decision":"denied"}}');
$('#interrupt').onclick = async () => {
  if (!sid) return;
  const button = $('#interrupt');
  if (!button.classList.contains('armed')) {
    button.classList.add('armed');
    button.textContent = 'stop?';
    button.title = 'click again to interrupt';
    button.setAttribute('aria-label', 'click again to interrupt running turn');
    interruptArmTimer = setTimeout(disarmInterrupt, 2500);
    return;
  }
  disarmInterrupt();
  const r = await send('{"interrupt":{"sid":' + sid + ',"report":true}}');
  handle(r);
};
$('#history-more').onclick = () => {
  if (!sid || !historyHasOlder || historyLoading || oldestSeq <= 1) return;
  historyLoading = true;
  historyBlocks = [];
  updateHistoryButton();
  const history = new EventSource('/history?sid=' + sid + '&before=' + oldestSeq);
  history.onmessage = e => {
    const message = JSON.parse(bigints(e.data));
    handle(message);
    if (message.replay_done) history.close();
  };
  history.onerror = () => {
    history.close();
    historyLoading = false;
    historyBlocks = [];
    updateHistoryButton();
    notice('could not load older history');
  };
};
$('#sandbox-btn').onclick = async () => {
  if (!sid || !cur) return;
  const r = await send('{"session_set_sandbox":{"sid":' + sid + ',"enabled":' + (!cur.sandboxed) + '}}');
  if (r.err) notice(r.err.msg); else loadSessions();
};
// ---- model picker and composer slash commands ----
let pickerModels = [];
function closePicker() { $('#picker').classList.remove('show'); }
function renderPicker(filter) {
  const list = $('#picker-list');
  list.replaceChildren();
  const f = filter.toLowerCase();
  for (const m of pickerModels) {
    if (f && !m.toLowerCase().includes(f)) continue;
    const row = el('div', null, m);
    if (cur && m === cur.model) row.classList.add('sel');
    row.onclick = () => { closePicker(); setModel(m); };
    list.appendChild(row);
    if (list.children.length >= 400) break;
  }
}
async function openModelPicker() {
  if (!sid) return;
  const r = await send('{"model_list":{}}');
  pickerModels = ((r.model_list_result || {}).models || []);
  if (!pickerModels.length && cur && cur.model) pickerModels = [cur.model];
  $('#picker-filter').value = '';
  renderPicker('');
  const picker = $('#picker');
  // Anchor above the model name, clamped so it never leaves the viewport.
  // Show first: offsetWidth reads 0 while display is none.
  picker.classList.add('show');
  const anchor = $('#status .model').getBoundingClientRect();
  picker.style.left = Math.max(12, Math.min(anchor.left, innerWidth - picker.offsetWidth - 12)) + 'px';
  picker.style.bottom = (innerHeight - anchor.top + 6) + 'px';
  $('#picker-filter').focus();
}
async function setModel(model) {
  const r = await send('{"session_set_model":{"sid":' + sid + ',"model":' + JSON.stringify(model) + '}}');
  if (r.err) { notice(r.err.msg); return; }
  $('#status .model').textContent = model;
  loadSessions();
}
$('#status .model').onclick = () => {
  if ($('#picker').classList.contains('show')) closePicker();
  else openModelPicker().catch(() => notice('could not load models'));
};
$('#picker-filter').addEventListener('input', e => renderPicker(e.target.value));
$('#picker-filter').addEventListener('keydown', e => {
  if (e.key === 'Escape') closePicker();
  if (e.key === 'Enter') {
    const first = $('#picker-list').firstChild;
    if (first) { closePicker(); setModel(first.textContent); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

// The composer accepts the session-scoped subset of slash commands; the rest
// belong to the terminal (screensavers, reboot, voice…) and say so.
async function slashCommand(raw) {
  const space = raw.indexOf(' ');
  const cmd = space < 0 ? raw : raw.slice(0, space);
  const arg = space < 0 ? '' : raw.slice(space + 1).trim();
  let r = null;
  if (cmd === '/model') {
    if (!arg) return openModelPicker();
    r = await send('{"session_set_model":{"sid":' + sid + ',"model":' + JSON.stringify(arg) + '}}');
    if (!r.err) $('#status .model').textContent = arg;
  } else if (cmd === '/sandbox') {
    const enable = arg === 'on' ? true : arg === 'off' ? false : !(cur && cur.sandboxed);
    r = await send('{"session_set_sandbox":{"sid":' + sid + ',"enabled":' + enable + '}}');
  } else if (cmd === '/permissions') {
    const full = arg === 'full' ? true : arg === 'default' ? false : !(cur && cur.full_access);
    r = await send('{"session_set_approvals":{"sid":' + sid + ',"approvals":"' + (full ? 'auto' : 'default') + '"}}');
    if (!r.err) notice(full ? 'FULL ACCESS — nothing asks for approval' : 'default approvals restored');
  } else if (cmd === '/compact') {
    r = await send('{"session_compact":{"sid":' + sid + '}}');
    if (!r.err) notice('compacting…');
  } else if (cmd === '/rename') {
    if (!arg) { notice('usage: /rename <title>'); return; }
    r = await send('{"session_rename":{"sid":' + sid + ',"title":' + JSON.stringify(arg) + '}}');
  } else if (cmd === '/archive') {
    r = await send('{"session_archive":{"sid":' + sid + ',"archived":true}}');
    if (!r.err) { sid = null; await loadSessions(); return; }
  } else if (cmd === '/new') {
    return $('#new-btn').onclick();
  } else if (cmd === '/interrupt') {
    r = await send('{"interrupt":{"sid":' + sid + ',"report":true}}');
  } else {
    notice(cmd + ' works in the terminal, not here');
    return;
  }
  if (r && r.err) notice(r.err.msg);
  else await loadSessions();
}
$('#topbar .title').onclick = () => { if (cur) renameSession(cur); };
$('#menu-btn').onclick = () => drawer(!$('#side').classList.contains('open'));
$('#backdrop').onclick = () => drawer(false);
// ---- connection, phone presence, and push ----
const pageId = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER) || 1;
let connectionReady = false, pushRegistration = null, pushSubscription = null, pushKey = null;
function connectionState(text) {
  $('#connection-state').textContent = text;
  $('#connection-badge').textContent = text === 'Connected' ? '' : text;
}
function phonePresence(active = document.visibilityState === 'visible') {
  if (!sid) return;
  fetch('/send', {method: 'POST', headers: {'Content-Type': 'application/json'}, keepalive: true,
    body: '{"presence":{"kind":"phone","page_id":' + pageId + ',"sid":' + sid +
      ',"active":' + (active && connectionReady) + '}}'}).catch(() => {});
}
function connectEvents() {
  if (es) es.close();
  connectionReady = false;
  connectionState(navigator.onLine ? 'Connecting…' : 'Offline');
  if (!sid) return;
  es = new EventSource('/events?sid=' + sid);
  es.onopen = () => { connectionReady = true; connectionState('Connected'); phonePresence(); };
  es.onmessage = e => handle(JSON.parse(bigints(e.data)));
  es.onerror = () => {
    connectionReady = false;
    connectionState(navigator.onLine ? 'Reconnecting…' : 'Offline');
    phonePresence(false);
  };
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { phonePresence(false); return; }
  connectEvents();
  loadSessions().catch(() => connectionState('Reconnecting…'));
});
window.addEventListener('pagehide', () => phonePresence(false));
window.addEventListener('offline', () => { connectionReady = false; connectionState('Offline'); });
window.addEventListener('online', () => { connectEvents(); loadSessions().catch(() => {}); });
setInterval(() => phonePresence(), 10000);
async function pushRequest(action, body) {
  const response = await fetch('/push/' + action, body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}
function pushLabel() {
  $('#push-toggle').textContent = pushSubscription ? 'Disable notifications' : 'Enable notifications';
}
async function setupCompanion() {
  try {
    const response = await fetch('/connection');
    if (!response.ok) throw Error('connection settings unavailable');
    const settings = await response.json();
    // Loopback needs no address advertisement (you are already here) and no
    // Tailscale lecture; the footer stays quiet unless something is actionable.
    if (settings.tailnet_host) {
      const url = 'https://' + settings.tailnet_host + '/';
      $('#canonical-url').href = url;
      $('#canonical-url').textContent = url;
      $('#connection-help').textContent = 'Add to Home Screen from this address.';
    }
    if (!settings.push_enabled) return;
    if (!isSecureContext || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      $('#push-help').textContent = 'Notifications need the Home Screen app (iOS 16.4+).';
      return;
    }
    await navigator.serviceWorker.register('/sw.js');
    pushRegistration = await navigator.serviceWorker.ready;
    const info = await pushRequest('info');
    pushKey = Uint8Array.from(atob(info.publicKey.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    pushSubscription = await pushRegistration.pushManager.getSubscription();
    if (pushSubscription) await pushRequest('subscribe', pushSubscription.toJSON());
    pushLabel();
    $('#push-toggle').hidden = false;
    $('#push-help').textContent = 'Quiet while you use a Marlin terminal or view this session here.';
  } catch (error) { $('#push-help').textContent = error.message; }
}
$('#push-toggle').onclick = async () => {
  const button = $('#push-toggle');
  button.disabled = true;
  try {
    if (pushSubscription) {
      await pushRequest('unsubscribe', {endpoint: pushSubscription.endpoint});
      await pushSubscription.unsubscribe();
      pushSubscription = null;
    } else {
      // Keep the permission request directly in the tap handler for iOS.
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') throw Error('Notifications are blocked. Allow them in iPhone Settings to try again.');
      pushSubscription = await pushRegistration.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: pushKey});
      try { await pushRequest('subscribe', pushSubscription.toJSON()); }
      catch (error) { await pushSubscription.unsubscribe(); pushSubscription = null; throw error; }
    }
    pushLabel();
    $('#push-help').textContent = pushSubscription ? 'Notifications enabled. Your laptop must stay awake to send updates.' : 'Notifications disabled.';
  } catch (error) { $('#push-help').textContent = error.message; }
  finally { button.disabled = false; }
};
setupCompanion();

// iOS can pan the visual viewport as well as resize it for the keyboard.
// Fit that rectangle without scrolling the document or losing reading position.
if (window.visualViewport) {
  const vv = window.visualViewport;
  let frame = 0;
  function fitViewport() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      const transcript = $('#transcript');
      const atBottom = transcript.scrollHeight - transcript.clientHeight - transcript.scrollTop < 48;
      if (matchMedia('(max-width: 700px)').matches && vv.scale === 1) {
        document.body.style.height = vv.height + 'px';
        document.body.style.top = vv.offsetTop + 'px';
        const keyboard = document.activeElement === $('#input') && window.innerHeight - vv.height > 100;
        document.body.style.setProperty('--bottom-inset', keyboard ? '0px' : 'env(safe-area-inset-bottom)');
      } else {
        document.body.style.height = '';
        document.body.style.top = '';
        document.body.style.removeProperty('--bottom-inset');
      }
      if (atBottom) transcript.scrollTop = transcript.scrollHeight;
    });
  }
  vv.addEventListener('resize', fitViewport);
  vv.addEventListener('scroll', fitViewport);
  window.addEventListener('resize', fitViewport);
  $('#input').addEventListener('focus', fitViewport);
  $('#input').addEventListener('blur', fitViewport);
  fitViewport();
}
$('#new-btn').onclick = async () => {
  const cwd = cur ? cur.cwd : '/tmp';
  const model = cur ? cur.model : '';
  const r = await send('{"session_create":{"cwd":' + JSON.stringify(cwd) + ',"model":' + JSON.stringify(model) + '}}');
  if (r.session_created) { sid = null; await loadSessions(); }
};

loadSessions().catch(() => connectionState('Reconnecting…'));
</script>
