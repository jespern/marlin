name: certify

# shadybin certification of a published release: rebuilds it, checks the binaries match,
# has Claude review the code that goes in (on the ANTHROPIC_API_KEY secret), attests the
# statement and report, and keeps them for the registry. release.yml calls this after
# publishing; run it by hand to re-certify an existing release, e.g. one published before
# a certify fix. This is the only place marlin names shadybin's certify: @v1, which moves
# to each compatible shadybin release, so it needs no updating.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to certify (e.g. v0.1.7)"
        type: string
        required: true

permissions: {}

jobs:
  shadybin:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: shadybin/shadybin/.github/workflows/certify.yml@v1
    with:
      tag: ${{ inputs.tag }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
