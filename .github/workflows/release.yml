name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag on a red commit must not ship. Same gates as ci.yml, on both OSes.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3
      - run: zig build fmt-check
      - run: zig build test
      - run: zig build e2e

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: marlin-x86_64-linux
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            artifact: marlin-aarch64-linux
            target: aarch64-linux-musl
          - runner: macos-15-intel
            artifact: marlin-x86_64-darwin
            target: x86_64-macos.13.0
          - runner: macos-15
            artifact: marlin-aarch64-darwin
            target: aarch64-macos.13.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release binary
        env:
          MARLIN_VERSION: ${{ github.ref_name }}
          MARLIN_TARGET: ${{ matrix.target }}
        run: zig build -Dtarget="$MARLIN_TARGET" -Doptimize=ReleaseSafe -Dembedded-sqlite=true -Dversion="${MARLIN_VERSION#v}"

      - name: Package release assets
        env:
          ARTIFACT: ${{ matrix.artifact }}
          MARLIN_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package
          cp zig-out/bin/marlin "dist/$ARTIFACT"
          chmod 755 "dist/$ARTIFACT"
          test "$("dist/$ARTIFACT" version)" = "marlin ${MARLIN_VERSION#v}"

          cp zig-out/bin/marlin LICENSE NOTICE THIRD_PARTY_NOTICES dist/package/
          chmod 755 dist/package/marlin
          tar -czf "dist/$ARTIFACT.tar.gz" -C dist/package \
            marlin LICENSE NOTICE THIRD_PARTY_NOTICES
          rm -r dist/package

          for asset in "$ARTIFACT" "$ARTIFACT.tar.gz"; do
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$asset" > "$asset.sha256")
            else
              (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
            fi
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARLIN_VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$MARLIN_VERSION" >/dev/null 2>&1; then
            gh release upload "$MARLIN_VERSION" dist/* --clobber
          else
            gh release create "$MARLIN_VERSION" dist/* --verify-tag --generate-notes --title "Marlin $MARLIN_VERSION"
          fi

      - name: Verify curl installer against published assets
        env:
          MARLIN_VERSION: ${{ github.ref_name }}
        run: |
          install_root=$(mktemp -d)
          trap 'rm -r "$install_root"' EXIT
          MARLIN_INSTALL_DIR="$install_root/bin" \
          MARLIN_ADD_TO_PATH=0 \
          MARLIN_RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/$MARLIN_VERSION" \
            sh site/install.sh
          test "$("$install_root/bin/marlin" version)" = "marlin ${MARLIN_VERSION#v}"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: jespern/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew formula
        env:
          MARLIN_VERSION: ${{ github.ref_name }}
        run: |
          version=${MARLIN_VERSION#v}
          darwin_arm_sha=$(awk '{ print $1 }' dist/marlin-aarch64-darwin.tar.gz.sha256)
          darwin_intel_sha=$(awk '{ print $1 }' dist/marlin-x86_64-darwin.tar.gz.sha256)
          linux_arm_sha=$(awk '{ print $1 }' dist/marlin-aarch64-linux.tar.gz.sha256)
          linux_intel_sha=$(awk '{ print $1 }' dist/marlin-x86_64-linux.tar.gz.sha256)

          for sha in "$darwin_arm_sha" "$darwin_intel_sha" "$linux_arm_sha" "$linux_intel_sha"; do
            test "${#sha}" -eq 64
          done

          mkdir -p homebrew-tap/Formula
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@DARWIN_ARM_SHA256@/$darwin_arm_sha/g" \
            -e "s/@DARWIN_INTEL_SHA256@/$darwin_intel_sha/g" \
            -e "s/@LINUX_ARM_SHA256@/$linux_arm_sha/g" \
            -e "s/@LINUX_INTEL_SHA256@/$linux_intel_sha/g" \
            scripts/homebrew/marlin.rb.in > homebrew-tap/Formula/marlin.rb

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/marlin.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "marlin $version"
            git -C homebrew-tap push
          fi
