name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: marlin-x86_64-linux
          - runner: ubuntu-24.04-arm
            artifact: marlin-aarch64-linux
          - runner: macos-15-intel
            artifact: marlin-x86_64-darwin
          - runner: macos-15
            artifact: marlin-aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release binary
        env:
          MARLIN_VERSION: ${{ github.ref_name }}
        run: zig build -Doptimize=ReleaseSafe -Dembedded-sqlite=true -Dversion="${MARLIN_VERSION#v}"

      - name: Package release assets
        env:
          ARTIFACT: ${{ matrix.artifact }}
          MARLIN_VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp zig-out/bin/marlin "dist/$ARTIFACT"
          chmod 755 "dist/$ARTIFACT"
          test "$("dist/$ARTIFACT" version)" = "marlin ${MARLIN_VERSION#v}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$ARTIFACT" > "$ARTIFACT.sha256")
          else
            (cd dist && shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256")
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARLIN_VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$MARLIN_VERSION" >/dev/null 2>&1; then
            gh release upload "$MARLIN_VERSION" dist/* --clobber
          else
            gh release create "$MARLIN_VERSION" dist/* --verify-tag --generate-notes --title "Marlin $MARLIN_VERSION"
          fi
