name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # nightly live smoke (needs OPENROUTER_API_KEY)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3 lsof procps

      # macOS ships sqlite3 in the SDK; nothing to install.

      - name: Format check
        run: zig build fmt-check

      - name: Installer tests
        run: sh scripts/test-install.sh

      - name: Unit + fixture tests
        run: zig build test

      - name: Verify embedded-SQLite release configuration
        if: runner.os == 'Linux'
        run: zig build -Doptimize=ReleaseSafe -Dembedded-sqlite=true

      - name: End-to-end scenarios
        run: zig build e2e

      # Reboot vs kill-9 must restore identical durable state — the
      # load-bearing recovery test (docs/TESTING.md). Linux leg only: it
      # needs lsof/pgrep/sqlite3 and isolated HOME/TMPDIR roots.
      - name: Reboot convergence
        if: runner.os == 'Linux'
        run: zig build converge

  smoke:
    # Live provider smoke — nightly + manual only, never blocks PRs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3
      - name: Live smoke against OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: zig build smoke

