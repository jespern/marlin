name: Setup Zig

description: Install the repository's pinned Zig toolchain without a Node runtime

inputs:
  version:
    description: Zig version to install
    required: true

runs:
  using: composite
  steps:
    - name: Download Zig
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS/$RUNNER_ARCH/$ZIG_VERSION" in
          macOS/ARM64/0.17.0)
            platform=aarch64-macos
            sha256=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
            ;;
          macOS/X64/0.17.0)
            platform=x86_64-macos
            sha256=4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6
            ;;
          Linux/ARM64/0.17.0)
            platform=aarch64-linux
            sha256=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
            ;;
          Linux/X64/0.17.0)
            platform=x86_64-linux
            sha256=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            ;;
          *)
            echo "unsupported Zig runner: $RUNNER_OS/$RUNNER_ARCH version $ZIG_VERSION" >&2
            exit 1
            ;;
        esac

        archive="$RUNNER_TEMP/zig-$platform-$ZIG_VERSION.tar.xz"
        install_dir="$RUNNER_TEMP/zig-$platform-$ZIG_VERSION"
        curl --fail --location --retry 3 --output "$archive" \
          "https://ziglang.org/download/$ZIG_VERSION/zig-$platform-$ZIG_VERSION.tar.xz"
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
        else
          actual=$(shasum -a 256 "$archive" | awk '{ print $1 }')
        fi
        test "$actual" = "$sha256"
        rm -rf "$install_dir"
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/zig" version
