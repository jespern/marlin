name: Setup Zig

description: Install the repository's pinned Zig toolchain without a Node runtime

inputs:
  version:
    description: Zig version to install
    required: true

runs:
  using: composite
  steps:
    - name: Download Zig
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS/$RUNNER_ARCH/$ZIG_VERSION" in
          macOS/ARM64/0.17.1)
            platform=aarch64-macos
            sha256=75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
            ;;
          macOS/X64/0.17.1)
            platform=x86_64-macos
            sha256=9af07b20319fbd0c92ee46ad23e81d6a782b1aaea2cfb8dcbff35f1d2c7ddbb7
            ;;
          Linux/ARM64/0.17.1)
            platform=aarch64-linux
            sha256=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
            ;;
          Linux/X64/0.17.1)
            platform=x86_64-linux
            sha256=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
            ;;
          *)
            echo "unsupported Zig runner: $RUNNER_OS/$RUNNER_ARCH version $ZIG_VERSION" >&2
            exit 1
            ;;
        esac

        archive="$RUNNER_TEMP/zig-$platform-$ZIG_VERSION.tar.xz"
        install_dir="$RUNNER_TEMP/zig-$platform-$ZIG_VERSION"
        curl --fail --location --retry 3 --output "$archive" \
          "https://ziglang.org/download/$ZIG_VERSION/zig-$platform-$ZIG_VERSION.tar.xz"
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
        else
          actual=$(shasum -a 256 "$archive" | awk '{ print $1 }')
        fi
        test "$actual" = "$sha256"
        rm -rf "$install_dir"
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/zig" version
